<style>

em{font-style:normal;color:var(--do)}

body{background:#cdeeff}
h1{color:#c92a2a}

body{background:linear-gradient(#bfe6ff,#e4f7c8 60%,#9bd96c) center/cover no-repeat;background-size:cover;background-position:center}
h1{color:#c92a2a!important;text-shadow:0 3px 0 #fff,0 0 12px #fff!important}

.ia{height:auto;max-width:100%;display:block}
.ie{font-family:var(--emoji)}
.san{width:100%;max-width:900px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4);position:relative;z-index:1}
.man{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4)}
.hoi{background:#fffbe6f2;border-radius:22px;padding:calc(var(--u)*1) calc(var(--u)*3);box-shadow:0 5px 0 #0003;font-size:max(17px,calc(var(--u)*3.6));color:#5a3200;text-align:center;max-width:820px}

.luoi{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.8) calc(var(--u)*3);justify-items:center}

.gios{display:flex;gap:calc(var(--u)*2.4);justify-content:center}
.gio{border:none;background:none;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;padding:0}
.gio .ia{width:calc(var(--u)*11.5);min-width:62px}
.gio .vn{position:absolute;top:32%;left:50%;transform:translateX(-50%);background:#e03131;color:#fff;border-radius:14px;padding:0 .5em;font-size:max(22px,calc(var(--u)*5.6));box-shadow:0 4px 0 #8f1d1d}
.gio .cp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:calc(var(--u)*4.4);max-width:calc(var(--u)*17)}

.cay .ht .ia{width:calc(var(--u)*10.5)}
.cay .ht.roi{animation:roi .9s ease-in forwards;pointer-events:none}
@keyframes roi{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(calc(var(--u)*30)) rotate(120deg);opacity:0}}
.pt{background:#fffbe6f2;border-radius:20px;padding:0 calc(var(--u)*3);font-size:max(26px,calc(var(--u)*8));color:#12304a;box-shadow:0 5px 0 #0003;min-height:1.3em}
.pt b{color:#e03131}
.nbs{display:flex;gap:calc(var(--u)*2.4);justify-content:center}

.nb:nth-child(3n){background:#7048e8;box-shadow:0 7px 0 #4c2fb0}

.nb.dung{background:#2f9e44;box-shadow:0 7px 0 #1e6b2e}
.cay3{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1) calc(var(--u)*3);justify-items:center}
.cay3 .ht .ia{width:calc(var(--u)*12);min-width:60px}
.cay3 .ht .w{font-size:max(22px,calc(var(--u)*5.4));top:52%;background:#fff3;color:#fff;text-shadow:0 2px 0 #0007;box-shadow:none}
.cay3 .ht.da .ia{visibility:visible;filter:grayscale(1) opacity(.35)}
.cay3 .ht.da{visibility:visible;pointer-events:none}
.cay3 .ht.da .w{color:#2f9e44;background:#fffbe6;text-shadow:none}
.gioc{display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:max(18px,calc(var(--u)*4));color:#5a3200;background:#fffbe6f2;border-radius:30px;padding:0 calc(var(--u)*2.4)}
.gioc .ia{width:calc(var(--u)*7);min-width:36px}
#pan{position:fixed;inset:0;background:#10401a99;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
#pan .the{background:#fffbe6;border-radius:28px;padding:calc(var(--u)*2.4) calc(var(--u)*3);text-align:center;max-width:640px;width:100%;box-shadow:0 9px 0 #0005;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4)}
#pan .cq{font-size:max(19px,calc(var(--u)*4.4));color:#5a3200}
#pan .tu{font-size:max(34px,calc(var(--u)*9));color:#e03131;letter-spacing:.08em}
#pan .doc{width:calc(var(--u)*11);height:calc(var(--u)*11);min-width:56px;min-height:56px;border-radius:50%;border:calc(var(--u)*1) solid #0a9cf0;background:#fff;color:#0a9cf0;font-size:max(24px,calc(var(--u)*5));box-shadow:0 6px 0 #0a6fb0;padding-left:.12em}
.opt{display:flex;align-items:center;gap:calc(var(--u)*2.4)}
.opt .radio{width:calc(var(--u)*5.5);height:calc(var(--u)*5.5);min-width:34px;min-height:34px;border-radius:50%;border:5px solid #adb5bd;background:#fff;cursor:pointer}
.opt .radio.dung{background:#2f9e44;border-color:#1e6b2e}
.opt .radio.sai{background:#e03131;border-color:#a61e1e;animation:lac .4s}
.opt .nut-nghe{width:calc(var(--u)*12);height:calc(var(--u)*12);min-width:64px;min-height:64px;border-radius:50%;border:calc(var(--u)*1.1) solid #0a9cf0;background:#fff;color:#0a9cf0;font-size:max(26px,calc(var(--u)*5.2));display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #0a6fb0;cursor:pointer;padding-left:.12em}
.dong{background:#fff;color:#5a3200;border:none;border-radius:16px;font-size:max(15px,calc(var(--u)*3));padding:.1em .8em;box-shadow:0 4px 0 #0003}

</style>

<body>
<div class="top"><span></span><span class="sao" id="tongSao"></span></div>
<h1>🍎 Khu Vườn Tri Thức</h1>
<div class="goiy" id="goiy"></div>
<div class="tien" id="tien"></div>

<div class="san">
 <div class="man" id="m1" hidden><div class="hoi" id="hoi1"></div><div class="luoi" id="cay1"></div><div class="gios" id="gio1"></div></div>
 <div class="man" id="m2" hidden><div class="hoi" id="hoi2"></div><div class="cay" id="cay2"></div><div class="pt" id="pt2"></div><div class="nbs" id="ch2"></div></div>
 <div class="man" id="m3" hidden><div class="hoi" id="hoi3">Chạm vào từng quả táo để mở câu hỏi. Trả lời đúng thì táo vào giỏ.</div><div class="cay3" id="cay3"></div><div class="gioc" id="gioc"></div></div>
</div>
<div id="pan" hidden><div class="the" id="the"></div></div>

<div id="man" hidden><div class="hop"><h2></h2><p></p><div class="sao3"></div><div class="hang"><button class="nutlon" id="manOk">Bắt đầu</button></div></div></div>
<script>

const $=i=>document.getElementById(i);
const xao=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cho=ms=>new Promise(r=>setTimeout(r,ms));
const lsx=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let tongSao=parseInt(lsx('vuon-sao')||'0',10)||0; const hienSao=()=>{const e=$('tongSao');if(e)e.textContent='⭐ '+tongSao};
function congSao(n){tongSao+=n;lsx('vuon-sao',tongSao);hienSao()}
/* Doc tieng Viet: uu tien giong Viet co san trong may, khong co thi doc bang giong Viet truc tuyen (can mang) */
let viVoice=null;const layGiong=()=>{if(!window.speechSynthesis)return;viVoice=speechSynthesis.getVoices().filter(x=>/^vi[-_]?/i.test(x.lang)||/vietnam|tiếng việt/i.test(x.name))[0]||null};
if(window.speechSynthesis){layGiong();speechSynthesis.onvoiceschanged=layGiong}
let amDS=[],amTT=0;
function noi(...ds){amTT++;const tt=amTT;amDS.forEach(a=>a.pause());amDS=[];if(window.speechSynthesis)speechSynthesis.cancel();
 if(viVoice&&window.speechSynthesis){ds.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=viVoice.lang;u.voice=viVoice;u.rate=.8;speechSynthesis.speak(u)});return}
 (function tiep(i){if(i>=ds.length||tt!==amTT)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(ds[i]));amDS.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>tiep(i+1);const p=a.play();if(p&&p.catch)p.catch(()=>{})})(0)}
/* Tieng bip bang WebAudio (khong can file am thanh) */
let ac=null;function bip(loai){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=loai==='dung'?[[660,0],[880,.12],[1175,.24]]:loai==='sai'?[[220,0],[180,.14]]:loai==='thang'?[[523,0],[659,.13],[784,.26],[1047,.39],[1319,.52]]:[[600,0]];
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=loai==='sai'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
/* Phao hoa emoji */
function phao(x,y,ds,n){ds=ds||['⭐','✨','🎉','🌟'];n=n||14;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='bay';e.textContent=ds[i%ds.length];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(22+Math.random()*22)+'px';e.style.setProperty('--dx',((Math.random()-.5)*360)+'px');e.style.setProperty('--dy',(-60-Math.random()*260)+'px');e.style.setProperty('--r',((Math.random()-.5)*400)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
const giua=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* Man hinh bat dau / ket thuc */
function manHinh(tieude,loi,nut,cb,saoSo){const m=$('man');m.hidden=false;m.querySelector('h2').textContent=tieude;m.querySelector('p').textContent=loi;m.querySelector('.sao3').textContent=saoSo?'⭐'.repeat(saoSo)+'☆'.repeat(3-saoSo):'';$('manOk').textContent=nut;$('manOk').onclick=()=>{m.hidden=true;cb()}}
function hienTien(n,xong){$('tien').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<xong?'xong':i===xong?'nay':'')+'"></i>').join('')}
hienSao();
/* To do phan van trong tu: boThanh bo dau thanh (huyen sac hoi nga nang) tung chu, giu nguyen chu cai mu/ngang */
const boThanh=c=>c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC');
function toVan(w,vans){const ch=[...w],nm=ch.map(boThanh).join('').toLowerCase();let best=null;
 for(const v of vans){const k=nm.lastIndexOf(v);if(k>=0&&(best===null||v.length>best.v.length))best={k,v}}
 if(!best)return w;const n=[...best.v].length;return ch.slice(0,best.k).join('')+'<em>'+ch.slice(best.k,best.k+n).join('')+'</em>'+ch.slice(best.k+n).join('')}


/* AM THANH: uu tien file mp3 doc san (am/), roi giong may, cuoi cung Google */
function amKey(t){const s=String(t).normalize('NFC').toLowerCase().replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let _am=[],_tt=0;
noi=function(...ds){_tt++;const tt=_tt;_am.forEach(a=>{try{a.pause()}catch(e){}});_am=[];if(window.speechSynthesis)speechSynthesis.cancel();ds=ds.filter(Boolean);
 (function tiep(i){if(i>=ds.length||tt!==_tt)return;const t=ds[i],k=amKey(t),dc=['am/'+k+'.mp3?v=2','../am/'+k+'.mp3?v=2','https://codiep-ai.netlify.app/am/'+k+'.mp3?v=2'];let n=0;
  const thu=()=>{if(tt!==_tt)return;if(n>=dc.length)return gg(t,tt,()=>tiep(i+1));const a=new Audio(dc[n]);_am.push(a);let xg=false;const sang=()=>{if(xg)return;xg=true;n++;thu()};a.onended=()=>{if(!xg){xg=true;tiep(i+1)}};a.onerror=sang;const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError'){xg=true;return}sang()})};thu()})(0)};
function gg(t,tt,xong){if(window.speechSynthesis){const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));if(v){const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.8;u.onend=xong;speechSynthesis.speak(u);return}}
 const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(t));_am.push(a);a.onended=xong;a.onerror=xong;const p=a.play();if(p&&p.catch)p.catch(()=>{})}

const PFX=['anh-game/','../anh-game/','https://codiep-ai.netlify.app/anh-game/'];
function IA(s,e,c){return '<img class="ia '+(c||'')+'" src="'+PFX[0]+s+'.webp" data-s="'+s+'" data-e="'+(e||'')+'" data-t="0" onerror="aErr(this)" alt="">'}
function aErr(el){const t=+el.dataset.t+1;if(t<PFX.length){el.dataset.t=t;el.src=PFX[t]+el.dataset.s+'.webp';return}const sp=document.createElement('span');sp.className='ie';sp.style.fontSize='3em';sp.textContent=el.dataset.e||'';el.replaceWith(sp)}
(function nen(t){const im=new Image();im.onload=()=>{document.body.style.backgroundImage='url('+im.src+')'};im.onerror=()=>{if(t+1<PFX.length)nen(t+1)};im.src=PFX[t]+'nen-vuon-tao.webp'})(0);
const TAO=['meo-tao-tao-do','meo-tao-tao-vang','meo-tao-tao-xanh'];
const NW=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín','mười'];
const TONG=3;let sai=0;
function vaoMan(k){['m1','m2','m3'].forEach((id,j)=>$(id).hidden=j!==k-1);hienTien(TONG,k-1);if(k===1)man1();else if(k===2)man2();else man3()}
function batDau(){sai=0;vaoMan(1)}

/* ===== NOI DUNG (cô sửa ở đây cho bài khác) ===== */
/* Chặng 1: mỗi vòng 3 giỏ vần, mỗi giỏ 2 từ: [vần, từ 1, từ 2] */
const T1=[[["et", "vẹt", "két"], ["êt", "nết", "tết"], ["it", "mít", "vịt"]], [["ut", "bút", "lụt"], ["ưt", "mứt", "dứt"], ["ap", "tháp", "rạp"]], [["ăp", "cặp", "bắp"], ["ôp", "hộp", "lốp"], ["ơp", "lớp", "chớp"]]];
/* Chặng 2: [số táo trên cây, số táo rơi] */
const P2=[[5, 2], [6, 0], [7, 3], [8, 8], [9, 4], [10, 6]];
/* Chặng 3: k=t điền vần (nghe từ), k=n nghe 2 từ, k=s phép trừ */
const C3=[{"k": "t", "q": "Nghe từ rồi chọn vần điền vào chỗ trống.", "w": "mứt", "show": "m__", "ch": ["ut", "ưt", "êt"], "ok": "ưt"}, {"k": "t", "q": "Nghe từ rồi chọn vần điền vào chỗ trống.", "w": "hộp", "show": "h__", "ch": ["ôp", "ơp", "op"], "ok": "ôp"}, {"k": "n", "q": "Nghe hai từ. Từ nào có vần êt?", "a": ["tết", "tất"], "ok": "tết"}, {"k": "s", "q": "Có 8 quả táo, rụng 3 quả. Còn mấy quả?", "say": "Có tám quả táo, rụng ba quả. Còn mấy quả?", "ch": [5, 4, 6], "ok": 5}, {"k": "s", "q": "9 - 9 = ?", "say": "Chín trừ chín bằng mấy?", "ch": [0, 1, 9], "ok": 0}, {"k": "s", "q": "10 - 4 = ?", "say": "Mười trừ bốn bằng mấy?", "ch": [6, 5, 7], "ok": 6}];

/* ===== Chặng 1: hái táo gom theo vần ===== */
let iv=0,sel=null,xong1=0,khoa1=false;
function man1(){iv=0;vong1()}
function vong1(){const v=T1[iv];sel=null;xong1=0;khoa1=false;
 $('hoi1').innerHTML='Chạm quả táo, rồi chạm giỏ đúng <b>vần</b>.';
 const as=xao(v.flatMap(b=>b.slice(1).map(w=>({w,v:b[0]}))));
 $('cay1').innerHTML=as.map((o,k)=>'<button class="ht" data-w="'+o.w+'" data-v="'+o.v+'">'+IA(TAO[k%3],'🍎')+'<span class="w">'+o.w+'</span></button>').join('');
 $('gio1').innerHTML=v.map(b=>'<button class="gio" data-v="'+b[0]+'">'+IA('meo-tao-gio-rong','🧺')+'<span class="vn">'+b[0]+'</span><div class="cp"></div></button>').join('');
 [...$('cay1').children].forEach(b=>b.onclick=()=>chonTao(b));
 [...$('gio1').children].forEach(b=>b.onclick=()=>chonGio(b));
 $('goiy').textContent='Vòng '+(iv+1)+'/'+T1.length+'. Mỗi giỏ nhận 2 quả táo.';noi('Hái táo bỏ vào giỏ đúng vần.')}
function chonTao(b){if(khoa1||b.classList.contains('da'))return;[...$('cay1').children].forEach(x=>x.classList.remove('chon'));sel=b;b.classList.add('chon');noi(b.dataset.w)}
async function chonGio(g){if(khoa1)return;if(!sel){$('goiy').textContent='Chạm một quả táo trước nhé!';return}
 const w=sel.dataset.w,v=g.dataset.v;
 if(sel.dataset.v===v){sel.classList.remove('chon');sel.classList.add('da');g.querySelector('.cp').insertAdjacentHTML('beforeend','<span>'+toVan(w,[boThanh(v)])+'</span>');sel=null;bip('dung');noi(w);const [x,y]=giua(g);phao(x,y,['🍎','✨'],5);xong1++;
  if(xong1>=6){khoa1=true;iv++;await cho(1200);if(iv>=T1.length){bip('thang');return vaoMan(2)}vong1()}}
 else{sai++;bip('sai');g.classList.add('sai');setTimeout(()=>g.classList.remove('sai'),450);$('goiy').textContent='Từ '+w+' chưa thuộc giỏ này. Thử giỏ khác nhé!'}}

/* ===== Chặng 2: gió thổi táo rơi, tính phép trừ ===== */
let i2=0,roi=0,khoa2=false;
const cauSo=(n,k)=>k===0?'Trên cây có '+NW[n]+' quả táo. Gió không làm rơi quả nào.':'Trên cây có '+NW[n]+' quả táo. Gió thổi rơi '+NW[k]+' quả.';
function man2(){i2=0;vong2()}
function vong2(){const [n,k]=P2[i2];roi=0;khoa2=false;$('pt2').innerHTML='';$('ch2').innerHTML='';
 $('hoi2').innerHTML=k===0?'Trên cây có <b>'+n+'</b> quả táo. Gió không làm rơi quả nào.':'Trên cây có <b>'+n+'</b> quả táo. Gió thổi rơi <b>'+k+'</b> quả. Chạm vào <b>'+k+'</b> quả táo cho rơi xuống.';
 $('cay2').innerHTML=Array.from({length:n},(_,j)=>'<button class="ht">'+IA(TAO[j%3],'🍎')+'</button>').join('');
 [...$('cay2').children].forEach(b=>b.onclick=()=>roiTao(b));
 $('goiy').textContent='Câu '+(i2+1)+'/'+P2.length+'. Đếm số táo còn lại trên cây.';noi(cauSo(n,k));
 if(k===0)setTimeout(phep2,900)}
async function roiTao(b){const [n,k]=P2[i2];if(khoa2||b.classList.contains('roi')||roi>=k)return;b.classList.add('roi');roi++;bip('dung');if(roi===k){await cho(900);phep2()}}
function phep2(){const [n,k]=P2[i2],r=n-k;$('pt2').innerHTML=n+' - '+k+' = <b>?</b>';
 const pool=xao([r+1,r-1,r+2,r-2,k,n].filter((v,j,a)=>v>=0&&v<=10&&v!==r&&a.indexOf(v)===j));
 const ds=xao([r,pool[0],pool[1]]);
 $('ch2').innerHTML=ds.map(v=>'<button class="nb" data-v="'+v+'">'+v+'</button>').join('');
 [...$('ch2').children].forEach(b=>b.onclick=()=>chon2(b));noi('Còn lại mấy quả táo?')}
async function chon2(b){if(khoa2)return;const [n,k]=P2[i2],r=n-k;
 if(+b.dataset.v===r){khoa2=true;b.classList.add('dung');$('pt2').innerHTML=n+' - '+k+' = <b>'+r+'</b>';bip('dung');noi(NW[n]+' trừ '+NW[k]+' bằng '+NW[r]);const [x,y]=giua(b);phao(x,y,['🍎','✨','⭐'],6);await cho(2200);i2++;if(i2>=P2.length){bip('thang');return vaoMan(3)}vong2()}
 else{sai++;bip('sai');b.classList.add('sai');setTimeout(()=>b.classList.remove('sai'),450);$('goiy').textContent='Chưa đúng. Đếm lại số táo còn trên cây nhé!'}}

/* ===== Chặng 3: cây tri thức, mỗi quả táo một câu hỏi ===== */
let Q3=[],hai=0,mo=-1;
function man3(){Q3=xao(C3.slice());hai=0;mo=-1;
 $('cay3').innerHTML=Q3.map((_,k)=>'<button class="ht" data-k="'+k+'">'+IA(TAO[k%3],'🍎')+'<span class="w">?</span></button>').join('');
 [...$('cay3').children].forEach(b=>b.onclick=()=>moCau(+b.dataset.k));capNhatGio();
 $('goiy').textContent='Có '+Q3.length+' quả táo. Chạm một quả để mở câu hỏi.';noi('Chạm vào quả táo để mở câu hỏi.')}
function capNhatGio(){$('gioc').innerHTML=IA('meo-tao-gio-day-tao','🧺')+'<span>Giỏ táo: '+hai+'/'+Q3.length+'</span>'}
function moCau(k){const q=Q3[k];if($('cay3').children[k].classList.contains('da'))return;mo=k;let h='<div class="cq">'+q.q+'</div>';
 if(q.k==='t')h+='<div class="tu">'+q.show+'</div><button class="doc" id="doc" aria-label="nghe">▶</button><div class="nbs">'+q.ch.map(v=>'<button class="nb" data-v="'+v+'">'+v+'</button>').join('')+'</div>';
 else if(q.k==='n'){window.__a3=xao(q.a);h+=window.__a3.map((_,j)=>'<div class="opt"><button class="radio" data-j="'+j+'" aria-label="chọn"></button><button class="nut-nghe" data-j="'+j+'" aria-label="nghe">▶</button></div>').join('')}
 else h+='<div class="nbs">'+q.ch.map(v=>'<button class="nb" data-v="'+v+'">'+v+'</button>').join('')+'</div>';
 h+='<button class="dong" id="dong">Đóng</button>';$('the').innerHTML=h;$('pan').hidden=false;
 if(q.k==='t'){$('doc').onclick=()=>noi(q.w);noi(q.w)}
 if(q.k==='s')noi(q.say);
 if(q.k==='n'){[...$('the').querySelectorAll('.nut-nghe')].forEach(b=>b.onclick=()=>noi(window.__a3[+b.dataset.j]));[...$('the').querySelectorAll('.radio')].forEach(b=>b.onclick=()=>traLoi3(b,window.__a3[+b.dataset.j]===q.ok));noi(q.q)}
 else [...$('the').querySelectorAll('.nb')].forEach(b=>b.onclick=()=>traLoi3(b,(q.k==='s'?+b.dataset.v:b.dataset.v)===q.ok));
 $('dong').onclick=()=>{$('pan').hidden=true}}
async function traLoi3(b,dung){if(b.classList.contains('dung'))return;
 if(!dung){sai++;bip('sai');b.classList.add('sai');setTimeout(()=>b.classList.remove('sai'),600);return}
 b.classList.add('dung');bip('dung');const q=Q3[mo],t=$('cay3').children[mo];const [x,y]=giua(b);phao(x,y,['🍎','✨','⭐'],8);
 if(q.k==='t')noi(q.w);await cho(900);$('pan').hidden=true;t.classList.add('da');t.querySelector('.w').textContent='✓';hai++;capNhatGio();
 if(hai>=Q3.length){await cho(500);ketThuc()}}
function ketThuc(){hienTien(TONG,TONG);const sao=sai<=4?3:sai<=10?2:1;congSao(sao);bip('thang');phao(innerWidth/2,innerHeight/2,['🍎','✨','⭐','🎉'],26);
 manHinh('Giỏ táo đầy rồi!','Con đã gom táo theo vần, tính táo rơi và trả lời hết cây tri thức. Con làm sai '+sai+' lần.','Chơi lại',batDau,sao)}
manHinh('Khu Vườn Tri Thức','Gom táo theo vần, tính xem còn mấy quả sau khi gió thổi, rồi trả lời câu hỏi trên cây tri thức.','Bắt đầu',batDau);

</script>
<script>
/*HS-NHAP*/
(function(){
 const SHEET='https://script.google.com/macros/s/AKfycbzE5tlog_osSNJ7Tsr4SnJPQCiv5LpyfQaDj8jNHNYzT9YEMGnQHTJrrpNXV_45lq1t/exec';
 const TEN_BAI=(document.title||'Game').slice(0,50)+' (luyện tập)';
 const HS={ten:'',lop:''};
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
 const chuanLop=s=>String(s||'').replace(/\s+/g,'').replace(/[,\/\-]/g,'.').toUpperCase();
 const lopLink=()=>String(window.LOP||new URLSearchParams(location.search).get('lop')||'').replace(/[^0-9A-Za-z.]/g,'').slice(0,10);
 const st=document.createElement('style');
 st.textContent='#hs-khung{margin:.3em 0 .6em}#hs-khung label{display:block;text-align:left;font-size:16px;margin:.4em 0 .1em;color:#12304a}#hs-khung input{width:100%;font:inherit;font-weight:700;font-size:20px;padding:.35em .6em;border:3px solid #74c0fc;border-radius:14px;text-align:center;color:#12304a;background:#fff}#hs-khung input:focus{outline:4px solid #ffd43b}#hs-loi{color:#e03131;font-size:16px;min-height:1.3em;margin:.2em 0 0}';
 document.head.appendChild(st);
 function go(){const d=$('hs-khung');if(d)d.remove()}
 function chen(){
  const hop=document.querySelector('#man .hop');if(!hop||$('hs-khung'))return;
  const d=document.createElement('div');d.id='hs-khung';
  d.innerHTML='<label for="hs-ten">Họ tên và lớp của con (viết trên một dòng)</label><input id="hs-ten" type="text" maxlength="50" autocomplete="off" placeholder="Nguyễn Minh An, 1/14"><p id="hs-loi"></p>';
  hop.insertBefore(d,hop.querySelector('.hang'));
  $('hs-ten').value=ls('hs-ten');
  $('hs-ten').addEventListener('keydown',e=>{if(e.key==='Enter')$('manOk').click()});
  const ok=$('manOk'),goc=ok.onclick;
  ok.onclick=()=>{const v=$('hs-ten').value.trim().replace(/\s+/g,' '),i=Math.max(v.lastIndexOf(','),v.lastIndexOf(';'));
   const t=i>0?v.slice(0,i).trim():'',l=i>0?v.slice(i+1).trim():'';
   if(t.length<2||!/\d/.test(l)){$('hs-loi').textContent='Con ghi họ tên, dấu phẩy, rồi lớp nhé. Ví dụ: Nguyễn Minh An, 1/14';$('hs-ten').focus();return}
   HS.ten=t;HS.lop=l;ls('hs-ten',v);go();goc&&goc()};
  setTimeout(()=>{try{$('hs-ten').focus()}catch(e){}},50)}
 function ghiChu(t){const p=$('man').querySelector('p');p.textContent=p.textContent.replace(/ (Đang gửi|Đã gửi|Chưa gửi|Ba mẹ chụp).*$/,'')+' '+t}
 function gui(sao){try{if(window.parent!==window)window.parent.postMessage({gb:1,sao:sao,tong:3,bai:TEN_BAI},'*')}catch(e){}
  if(!HS.ten)return;
  const CHUP='Ba mẹ chụp màn hình này gửi cô nhé.';
  const lop=lopLink()||(chuanLop(HS.lop)==='1.14'?'1.14':'');
  if(!lop){ghiChu(CHUP);return}
  ghiChu('Đang gửi kết quả cho cô...');
  let lan='?';try{if(typeof sai==='number')lan=sai}catch(e){}
  const d={lop,ten:HS.ten+' (lớp '+HS.lop+')',bai:TEN_BAI,dungLanDau:sao,soCau:3,chiTiet:'Sao: '+sao+'/3; số lần sai: '+lan+(window.DIEM?'; Điểm: '+window.DIEM:'')};
  fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)})
   .then(()=>ghiChu('Đã gửi kết quả cho cô.'),()=>ghiChu('Chưa gửi được. '+CHUP))}
 const mh=manHinh;
 manHinh=function(tieude,loi,nut,cb,saoSo){go();mh(tieude,loi,nut,cb,saoSo);if(saoSo)gui(saoSo)};
 window.__hsGui=gui;
 if(!/[?&]gb=1/.test(location.search))chen();
})();

</script>
