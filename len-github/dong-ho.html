<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đồng hồ đếm ngược</title>
<link rel="manifest" href="dong-ho-manifest.json">
<link rel="icon" href="dong-ho-icon.svg">
<meta name="theme-color" content="#e64980">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#fff0f6;--ink:#2b2b2b;--main:#e64980;--ok:#f06595;--warn:#e03131;--card:#ffffff}
  #tho{width:clamp(110px,18vw,190px);height:auto;margin-bottom:-4px;overflow:visible}
  #tho .tai{transform-origin:50% 100%;transform-box:fill-box;animation:vay 2.4s ease-in-out infinite}
  #tho .tai.p{animation-delay:.3s}
  @keyframes vay{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
  #tho .mat{transform-origin:center;transform-box:fill-box;animation:chop 4s infinite}
  @keyframes chop{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  body.het #tho{animation:nhun .35s infinite alternate}
  @keyframes nhun{to{transform:translateY(-18px)}}
  .chon{background:#ffdeeb!important}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;padding:16px;transition:background .3s}
  body.gan-het{background:#ffe3e3}
  body.het{background:#ffc9c9;animation:nhay .5s infinite alternate}
  @keyframes nhay{to{background:#fff0f0}}
  h1{margin:0 0 8px;font-size:clamp(18px,3vw,28px);color:var(--main)}
  .khung{background:#fff;border:10px solid #b6c9f0;border-radius:64px;padding:22px 48px 18px;margin-bottom:22px;
    box-shadow:0 8px 24px rgba(79,111,181,.25);display:flex;flex-direction:column;align-items:center}
  #tg{font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(80px,20vw,260px);line-height:1;
    margin:6px 0 0;letter-spacing:2px;
    background:linear-gradient(180deg,#9db8ff 0%,#3555c9 30%,#14267a 52%,#2f4fc4 74%,#a9c0ff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 3px 2px rgba(20,38,122,.35))}
  body.gan-het #tg,body.het #tg{background:linear-gradient(180deg,#ff9b9b 0%,#e03131 35%,#8f1010 55%,#e03131 78%,#ffb0b0 100%);
    -webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 2px rgba(143,16,16,.35))}
  #thanh{width:min(900px,92vw);height:16px;background:#ffd6e7;border-radius:10px;overflow:hidden;margin-bottom:22px}
  #thanh i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
  body.gan-het #thanh i,body.het #thanh i{background:var(--warn)}
  .hang{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
  button{font:inherit;font-size:clamp(16px,2.2vw,24px);border:0;border-radius:12px;padding:12px 22px;cursor:pointer;
    background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  button:hover{transform:translateY(-1px)}
  .chon{background:#fff3bf}
  .chinh{background:#f06595;color:#fff;font-weight:700;min-width:140px}
  .dung{background:var(--warn);color:#fff;font-weight:700;min-width:140px}
  .tuy input{font:inherit;font-size:20px;width:80px;padding:10px;border:2px solid #ffd8a8;border-radius:10px;text-align:center}
  .tuy span{font-size:20px;align-self:center}
  small{margin-top:14px;color:#777}
</style>
</head>
<body>
  <div class="khung">
  <svg id="tho"viewBox="0 0 200 210" aria-label="Thỏ hồng">
    <g class="tai"><ellipse cx="72" cy="55" rx="22" ry="52" fill="#ffb3cf" transform="rotate(-8 72 55)"/>
      <ellipse cx="72" cy="58" rx="11" ry="38" fill="#ff7eb0" transform="rotate(-8 72 58)"/></g>
    <g class="tai p"><ellipse cx="128" cy="55" rx="22" ry="52" fill="#ffb3cf" transform="rotate(8 128 55)"/>
      <ellipse cx="128" cy="58" rx="11" ry="38" fill="#ff7eb0" transform="rotate(8 128 58)"/></g>
    <ellipse cx="100" cy="143" rx="76" ry="62" fill="#ffc9dd"/>
    <ellipse cx="62" cy="158" rx="15" ry="10" fill="#ff9fc3" opacity=".75"/>
    <ellipse cx="138" cy="158" rx="15" ry="10" fill="#ff9fc3" opacity=".75"/>
    <g class="mat"><ellipse cx="70" cy="132" rx="8" ry="10" fill="#3b2a33"/><ellipse cx="130" cy="132" rx="8" ry="10" fill="#3b2a33"/>
      <circle cx="73" cy="128" r="3" fill="#fff"/><circle cx="133" cy="128" r="3" fill="#fff"/></g>
    <ellipse cx="100" cy="150" rx="8" ry="6" fill="#e64980"/>
    <path d="M100 156 V164 M100 164 Q90 174 82 166 M100 164 Q110 174 118 166" stroke="#a63a63" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g stroke="#e8a0bc" stroke-width="2" stroke-linecap="round"><path d="M34 148 L12 144 M34 157 L12 161 M166 148 L188 144 M166 157 L188 161"/></g>
  </svg>
  <div id="tg">00:20</div>
  </div>
  <div id="thanh"><i id="vach"></i></div>

  <div class="hang" id="mau">
    <button class="chon" data-p="20">20 giây</button>
    <button class="chon" data-p="30">30 giây</button>
    <button class="chon" data-p="60">60 giây</button>
  </div>
  <div class="hang">
    <button id="bat" class="chinh">▶ Bắt đầu</button>
    <button id="lai">↺ Làm lại</button>
    <button id="toan">⛶ Toàn màn hình</button>
  </div>
  <button id="cai" style="display:none;background:#e64980;color:#fff;font-weight:700;margin-top:10px">⬇ Tải về máy, dùng không cần mạng</button>
  <small id="huong"></small>
  <small>Phím tắt: Cách (Space) bắt đầu / tạm dừng · R làm lại · F toàn màn hình</small>

<script>
let tong=20, con=20, hen=null, ketThuc=0;
const $=id=>document.getElementById(id);

function hien(){
  const m=Math.floor(con/60), s=con%60;
  const txt=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  $("tg").textContent=txt; document.title=txt;
  $("vach").style.width=(tong?con/tong*100:0)+"%";
  document.body.classList.toggle("gan-het",con<=10&&con>0);
  document.body.classList.toggle("het",con===0&&tong>0);
}
let au=null, truoc=-1;
function ctx(){
  try{
    if(!au) au=new (window.AudioContext||window.webkitAudioContext)();
    if(au.state==="suspended") au.resume();
  }catch(e){}
  return au;
}
// một nốt nhạc êm: sóng sin + sóng hài, tắt dần như chuông nhỏ
function not(f,bd,dai,vol){
  const a=ctx(); if(!a) return;
  const t=a.currentTime+bd;
  [[1,1],[2,.25]].forEach(([h,v])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type="sine";o.frequency.value=f*h;o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol*v,t+.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dai);
    o.start(t);o.stop(t+dai+.05);
  });
}
function nhacBatDau(){not(523,0,.35,.25);not(784,.12,.5,.25);}            // đô - son: bắt đầu
function tic(giay){not(giay<=3?1047:784,0,.18,giay<=3?.3:.18);}           // tích tắc nhẹ 5 giây cuối
function nhacHetGio(){                                                     // giai điệu vui: đô mi son đô cao
  [523,659,784,1047,784,1047].forEach((f,i)=>not(f,i*.2,.5,.3));
  setTimeout(()=>{[523,659,784,1047].forEach((f,i)=>not(f,i*.18,.5,.3));},1500);
}
function dung(){clearInterval(hen);hen=null;$("bat").textContent="▶ Tiếp tục";$("bat").className="chinh";}
function chay(){
  if(con<=0) con=tong;
  ketThuc=Date.now()+con*1000; truoc=con; nhacBatDau();
  $("bat").textContent="⏸ Tạm dừng";$("bat").className="dung";
  hen=setInterval(()=>{
    con=Math.max(0,Math.round((ketThuc-Date.now())/1000));
    hien();
    if(con!==truoc){
      truoc=con;
      if(con<=5&&con>0) tic(con);
      if(con===0){dung();$("bat").textContent="▶ Bắt đầu";nhacHetGio();}
    }
  },200);
}
function datGio(giay){
  if(hen) dung();
  tong=con=Math.max(0,giay);
  $("bat").textContent="▶ Bắt đầu";$("bat").className="chinh";
  hien();
}
$("bat").onclick=()=>hen?dung():chay();
$("lai").onclick=()=>datGio(tong);
$("mau").onclick=e=>{const p=e.target.dataset.p;if(p)datGio(+p);};
$("toan").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();$("bat").click();}
  if(e.key==="r"||e.key==="R")$("lai").click();
  if(e.key==="f"||e.key==="F")$("toan").click();
});
// Cài về máy (dùng không cần mạng)
let sk=null;
const daCai=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(location.protocol.startsWith("http")&&"serviceWorker"in navigator) navigator.serviceWorker.register("dong-ho-sw.js").catch(()=>{});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();sk=e;if(!daCai)$("cai").style.display="";});
$("cai").onclick=async()=>{if(sk){sk.prompt();await sk.userChoice;sk=null;$("cai").style.display="none";}};
if(!daCai&&location.protocol.startsWith("http")&&/iphone|ipad/i.test(navigator.userAgent))
  $("huong").textContent="iPhone: bấm nút Chia sẻ rồi chọn \"Thêm vào MH chính\" để dùng không cần mạng.";
hien();
</script>
</body>
</html>
