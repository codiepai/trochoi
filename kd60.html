<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hái Bầu Trên Giàn - Khởi động Bài 60</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>

[hidden]{display:none!important}
:root{--u:min(1vh,1.6vw);--chu:#12304a;--xanh:#0b5cab;--do:#e03131;--la:#2f9e44;--cam:#f08c00;--tim:#7048e8;--hong:#e64980;--font:"Baloo 2","Segoe UI",Arial,sans-serif;--emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);font-weight:800;color:var(--chu);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*1.2) 14px;gap:calc(var(--u)*.8);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer}
button:focus-visible{outline:5px solid var(--xanh);outline-offset:3px}
.top{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a{color:var(--xanh);text-decoration:none;font-size:max(15px,calc(var(--u)*2.8));background:#ffffffcc;border-radius:30px;padding:4px 14px}
.sao{background:#fff;border-radius:30px;padding:4px 16px;font-size:max(16px,calc(var(--u)*3));color:#b86200;box-shadow:0 3px 0 #0002}
h1{font-size:max(26px,calc(var(--u)*6.4));line-height:1.05;text-align:center;text-shadow:0 4px 0 #fff}
.goiy{font-size:max(18px,calc(var(--u)*3.8));text-align:center;color:var(--xanh);min-height:1.35em}
.tien{display:flex;gap:6px;justify-content:center}
.tien i{width:max(14px,calc(var(--u)*2.4));height:max(14px,calc(var(--u)*2.4));border-radius:50%;background:#fff;border:3px solid #0003}
.tien i.xong{background:var(--la);border-color:#1e6b2e}
.tien i.nay{background:#ffd43b;border-color:var(--cam)}
.nutlon{font-size:max(22px,calc(var(--u)*5));padding:.3em 1.1em;border:none;border-radius:20px;color:#fff;background:var(--cam);box-shadow:0 6px 0 #b86200}
.nutlon:active{transform:translateY(4px);box-shadow:0 2px 0 #b86200}
.phu{background:#fff;color:var(--xanh);box-shadow:0 6px 0 #9bb8d3}
#man{position:fixed;inset:0;background:#0b3a6acc;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#man .hop{background:#fff;border-radius:30px;padding:calc(var(--u)*3) calc(var(--u)*4);text-align:center;max-width:620px;box-shadow:0 10px 0 #0004}
#man h2{font-size:max(30px,calc(var(--u)*7));color:var(--xanh);line-height:1.05}
#man p{font-size:max(18px,calc(var(--u)*3.6));margin:.5em 0 .8em;font-weight:700}
#man .sao3{font-size:max(46px,calc(var(--u)*11));letter-spacing:.1em;margin:.1em 0}
#man .hang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bay{position:fixed;pointer-events:none;font-family:var(--emoji);z-index:60;animation:bay 1.3s ease-out forwards}
@keyframes bay{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.lac{animation:lac .4s}
@keyframes lac{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.nhun{animation:nhun .5s}
@keyframes nhun{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
em{font-style:normal;color:var(--do)}

body{background:#bfeaff}
h1{color:#2e7d32}

body{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22400%22%20height%3D%22230%22%3E%3Cg%20stroke%3D%22%23c89a5b%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M0%2055H400M0%20135H400M70%200L40%20230M210%200L190%20230M345%200L330%20230%22/%3E%3C/g%3E%3Cpath%20transform%3D%22translate%2850%2060%29%20rotate%28-15%29%22%20d%3D%22M0%200C-34%20-8%20-40%20-40%20-14%20-42C-10%20-62%2018%20-62%2020%20-42C46%20-40%2038%20-6%200%200Z%22%20fill%3D%22%2337913f%22/%3E%3Cpath%20transform%3D%22translate%28190%2040%29%20rotate%2820%29%22%20d%3D%22M0%200C-34%20-8%20-40%20-40%20-14%20-42C-10%20-62%2018%20-62%2020%20-42C46%20-40%2038%20-6%200%200Z%22%20fill%3D%22%234caf50%22/%3E%3Cpath%20transform%3D%22translate%28330%2070%29%20rotate%28-30%29%22%20d%3D%22M0%200C-34%20-8%20-40%20-40%20-14%20-42C-10%20-62%2018%20-62%2020%20-42C46%20-40%2038%20-6%200%200Z%22%20fill%3D%22%232f7d36%22/%3E%3Cpath%20transform%3D%22translate%28120%20150%29%20rotate%2840%29%22%20d%3D%22M0%200C-34%20-8%20-40%20-40%20-14%20-42C-10%20-62%2018%20-62%2020%20-42C46%20-40%2038%20-6%200%200Z%22%20fill%3D%22%2358b956%22/%3E%3Cpath%20transform%3D%22translate%28370%20180%29%20rotate%2810%29%22%20d%3D%22M0%200C-34%20-8%20-40%20-40%20-14%20-42C-10%20-62%2018%20-62%2020%20-42C46%20-40%2038%20-6%200%200Z%22%20fill%3D%22%2343a047%22/%3E%3Cpath%20transform%3D%22translate%28260%20130%29%20rotate%28-50%29%22%20d%3D%22M0%200C-34%20-8%20-40%20-40%20-14%20-42C-10%20-62%2018%20-62%2020%20-42C46%20-40%2038%20-6%200%200Z%22%20fill%3D%22%2337913f%22/%3E%3C/svg%3E") top center repeat-x,linear-gradient(#bfeaff,#eafbe0 70%,#c9efae) fixed}
h1{background:#fffbe6ee;border-radius:20px;padding:0 .6em;box-shadow:0 5px 0 #0003}
.goiy{background:#ffffffdd;border-radius:14px;padding:0 .6em;color:#1b5e20}
.san{width:100%;max-width:900px;flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.8);position:relative}
.man{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.8)}
.hoi{background:#fffbe6f2;border-radius:22px;padding:calc(var(--u)*1.2) calc(var(--u)*3);box-shadow:0 6px 0 #0003;font-size:max(19px,calc(var(--u)*4.2));color:#4a3200;text-align:center;max-width:820px}
.hoi b{color:#e03131;font-size:1.35em}
.day{display:flex;justify-content:center;align-items:flex-start;gap:calc(var(--u)*1.5);width:100%}
.bau{border:none;background:none;padding:0;position:relative;width:min(31vw,calc(var(--u)*25));aspect-ratio:200/270;transform-origin:50% 0;animation:dua 3.4s ease-in-out infinite}
.bau:nth-child(2){animation-delay:-1.2s;margin-top:calc(var(--u)*4)}
.bau:nth-child(3){animation-delay:-2.3s}
@keyframes dua{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bau svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 5px #0003)}
.bau span{position:absolute;left:0;right:0;top:63%;transform:translateY(-50%);font-size:min(8vw,calc(var(--u)*6.4));color:#143d17;line-height:1.1;text-shadow:0 0 8px #fff,0 0 8px #fff}
.bau.to{width:min(40vw,calc(var(--u)*21));cursor:default}
.bau.to span{font-size:min(9vw,calc(var(--u)*6))}
.bau.chin svg{filter:drop-shadow(0 0 18px #ffd000) saturate(1.3) brightness(1.1)}
.bau.chin{animation:nhun .5s}
.bau.sai{animation:lac .4s}
.bau.sai svg{filter:grayscale(1)}
.gio{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#e9c48a;border:4px solid #a8743a;border-radius:12px 12px 34px 34px;min-height:calc(var(--u)*8);min-width:60%;padding:8px 12px}
.gio i{font-style:normal;background:#d9f2c4;border-radius:20px;padding:0 .6em;font-size:max(18px,calc(var(--u)*3.8));color:#143d17}
.chon{display:flex;gap:calc(var(--u)*5);justify-content:center}
.opt{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6)}
.opt .radio{width:calc(var(--u)*6);height:calc(var(--u)*6);min-width:42px;min-height:42px;border-radius:50%;border:5px solid #adb5bd;background:#fff}
.opt .radio.dung{background:#2f9e44;border-color:#1e6b2e}
.opt .radio.sai{background:#e03131;border-color:#a61e1e;animation:lac .4s}
.nut-nghe{width:calc(var(--u)*13);height:calc(var(--u)*13);min-width:70px;min-height:70px;border-radius:50%;border:calc(var(--u)*1.2) solid #0a9cf0;background:#fff;color:#0a9cf0;font-size:max(30px,calc(var(--u)*5.5));display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #0a6fb0;padding-left:.12em}
.nut-nghe:active{transform:translateY(4px);box-shadow:0 3px 0 #0a6fb0}
.doan{background:#fff6bf;border:4px solid #f0c419;border-radius:26px;padding:calc(var(--u)*1.2) calc(var(--u)*2.4);font-size:max(19px,calc(var(--u)*3.8));line-height:1.45;color:#222;max-width:820px;text-align:center}
.doan u{text-decoration:none;cursor:pointer;border-radius:8px}
.doan u.doc{background:#ffd43b}
.nghe-ca{font-size:max(18px,calc(var(--u)*3.6));border:none;border-radius:30px;background:#0a9cf0;color:#fff;padding:.25em 1em;box-shadow:0 5px 0 #0a6fb0}
.tl{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.6);width:min(94vw,760px)}
.tl button,.khay button{font-size:max(21px,calc(var(--u)*4.4));padding:.2em .8em;border:none;border-radius:20px;color:#143d17;background:#d9f2c4;box-shadow:0 6px 0 #4c8c3a}
.tl button.dung{background:#ffd43b;box-shadow:0 6px 0 #b86200}
.tl button.sai,.khay button.sai{background:#ced4da;box-shadow:0 6px 0 #868e96;animation:lac .4s}
.khung2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#fffbe6f2;border-radius:22px;border-bottom:8px solid #e8a33d;width:min(94vw,820px)}
.khung2 span{font-size:max(21px,calc(var(--u)*4.4));background:#d9f2c4;border-radius:14px;padding:.05em .5em}
.khung2 span.trong{background:#f1f3f5;color:transparent;min-width:2.4em}
.khay{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6);justify-content:center}
.khay button.da{visibility:hidden}
.ga{width:min(34vw,calc(var(--u)*16));height:auto;display:block}
#m3{gap:calc(var(--u)*1.1)}
@media (max-width:600px){h1{font-size:24px}.doan{font-size:17px;line-height:1.35}.goiy{font-size:15px}.nghe-ca{font-size:16px}}
html,body{height:auto;min-height:100%}
body{overflow-y:auto;padding-bottom:calc(var(--u)*6)}

</style>
</head>
<body>
<div class="top"><span></span><span class="sao" id="tongSao"></span></div>
<h1>🍃 Hái Bầu Trên Giàn</h1>
<div class="goiy" id="goiy"></div>
<div class="tien" id="tien"></div>

<div class="san">
 <div class="man" id="m1" hidden><div class="hoi" id="hoi1"></div><div class="day" id="day1"></div><div class="gio" id="gio"></div></div>
</div>

<div id="man" hidden><div class="hop"><h2></h2><p></p><div class="sao3"></div><div class="hang"><button class="nutlon" id="manOk">Bắt đầu</button></div></div></div>
<script>

const $=i=>document.getElementById(i);
const xao=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cho=ms=>new Promise(r=>setTimeout(r,ms));
const lsx=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let tongSao=parseInt(lsx('vuon-sao')||'0',10)||0; const hienSao=()=>{const e=$('tongSao');if(e)e.textContent='⭐ '+tongSao};
function congSao(n){tongSao+=n;lsx('vuon-sao',tongSao);hienSao()}
/* Doc tieng Viet: uu tien giong Viet co san trong may, khong co thi doc bang giong Viet truc tuyen (can mang) */
let viVoice=null;const layGiong=()=>{if(!window.speechSynthesis)return;viVoice=speechSynthesis.getVoices().filter(x=>/^vi[-_]?/i.test(x.lang)||/vietnam|tiếng việt/i.test(x.name))[0]||null};
if(window.speechSynthesis){layGiong();speechSynthesis.onvoiceschanged=layGiong}
let amDS=[],amTT=0;
function noi(...ds){amTT++;const tt=amTT;amDS.forEach(a=>a.pause());amDS=[];if(window.speechSynthesis)speechSynthesis.cancel();
 if(viVoice&&window.speechSynthesis){ds.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=viVoice.lang;u.voice=viVoice;u.rate=.8;speechSynthesis.speak(u)});return}
 (function tiep(i){if(i>=ds.length||tt!==amTT)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(ds[i]));amDS.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>tiep(i+1);const p=a.play();if(p&&p.catch)p.catch(()=>{})})(0)}
/* Tieng bip bang WebAudio (khong can file am thanh) */
let ac=null;function bip(loai){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=loai==='dung'?[[660,0],[880,.12],[1175,.24]]:loai==='sai'?[[220,0],[180,.14]]:loai==='thang'?[[523,0],[659,.13],[784,.26],[1047,.39],[1319,.52]]:[[600,0]];
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=loai==='sai'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
/* Phao hoa emoji */
function phao(x,y,ds,n){ds=ds||['⭐','✨','🎉','🌟'];n=n||14;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='bay';e.textContent=ds[i%ds.length];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(22+Math.random()*22)+'px';e.style.setProperty('--dx',((Math.random()-.5)*360)+'px');e.style.setProperty('--dy',(-60-Math.random()*260)+'px');e.style.setProperty('--r',((Math.random()-.5)*400)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
const giua=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* Man hinh bat dau / ket thuc */
function manHinh(tieude,loi,nut,cb,saoSo){const m=$('man');m.hidden=false;m.querySelector('h2').textContent=tieude;m.querySelector('p').textContent=loi;m.querySelector('.sao3').textContent=saoSo?'⭐'.repeat(saoSo)+'☆'.repeat(3-saoSo):'';$('manOk').textContent=nut;$('manOk').onclick=()=>{m.hidden=true;cb()}}
function hienTien(n,xong){$('tien').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<xong?'xong':i===xong?'nay':'')+'"></i>').join('')}
hienSao();
/* To do phan van trong tu: boThanh bo dau thanh (huyen sac hoi nga nang) tung chu, giu nguyen chu cai mu/ngang */
const boThanh=c=>c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC');
function toVan(w,vans){const ch=[...w],nm=ch.map(boThanh).join('').toLowerCase();let best=null;
 for(const v of vans){const k=nm.lastIndexOf(v);if(k>=0&&(best===null||v.length>best.v.length))best={k,v}}
 if(!best)return w;const n=[...best.v].length;return ch.slice(0,best.k).join('')+'<em>'+ch.slice(best.k,best.k+n).join('')+'</em>'+ch.slice(best.k+n).join('')}


/* AM THANH: uu tien file mp3 doc san (am/), roi giong may, cuoi cung Google */
function amKey(t){const s=String(t).normalize('NFC').toLowerCase().replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let _am=[],_tt=0;
noi=function(...ds){_tt++;const tt=_tt;_am.forEach(a=>{try{a.pause()}catch(e){}});_am=[];if(window.speechSynthesis)speechSynthesis.cancel();ds=ds.filter(Boolean);
 (function tiep(i){if(i>=ds.length||tt!==_tt)return;const t=ds[i],k=amKey(t),dc=['am/'+k+'.mp3?v=2','../am/'+k+'.mp3?v=2','https://codiep-ai.netlify.app/am/'+k+'.mp3?v=2'];let n=0;
  const thu=()=>{if(tt!==_tt)return;if(n>=dc.length)return gg(t,tt,()=>tiep(i+1));const a=new Audio(dc[n]);_am.push(a);let xg=false;const sang=()=>{if(xg)return;xg=true;n++;thu()};a.onended=()=>{if(!xg){xg=true;tiep(i+1)}};a.onerror=sang;const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError'){xg=true;return}sang()})};thu()})(0)};
function gg(t,tt,xong){if(window.speechSynthesis){const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));if(v){const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.8;u.onend=xong;speechSynthesis.speak(u);return}}
 const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(t));_am.push(a);a.onended=xong;a.onerror=xong;const p=a.play();if(p&&p.catch)p.catch(()=>{})}

function bauSVG(){return '<svg viewBox="0 0 200 270" aria-hidden="true"><path d="M100 0C98 14 104 20 100 36" stroke="#4c7a2a" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M104 20c22-22 46-12 52 2-22 12-40 10-52-2z" fill="#4caf50"/><path d="M100 30C66 30 58 62 64 86C68 104 66 110 48 124C20 146 8 168 10 192C14 238 52 266 100 266C148 266 186 238 190 192C192 168 180 146 152 124C134 110 132 104 136 86C142 62 134 30 100 30Z" fill="#a6d96a" stroke="#5c9a34" stroke-width="5"/><ellipse cx="62" cy="165" rx="16" ry="30" fill="#fff" opacity=".35" transform="rotate(24 62 165)"/></svg>'}
function qua(chu,cls){return '<button class="bau '+(cls||'')+'" data-w="'+chu+'">'+bauSVG()+'<span>'+chu+'</span></button>'}

/* ===== NOI DUNG (cô sửa ở đây): bảng từ Bài 60 ===== */
const CH=[{v:'ep',ok:'đẹp',no:['kịp','sáng']},
          {v:'êp',ok:'xếp',no:['đẹp','đích']},
          {v:'up',ok:'cúp',no:['xếp','vách']},
          {v:'anh',ok:'rãnh',no:['đình','vâng']},
          {v:'ach',ok:'vách',no:['đích','rãnh']},
          {v:'ich',ok:'đích',no:['chếch','kịp']}];
const MOI=[{w:'ghềnh',v:'ênh'},{w:'đình',v:'inh'},{w:'chếch',v:'êch'},{w:'thẳng',v:'ăng'}];
let i=0,sai=0,khoa=false,da=0;
function batDau(){i=0;sai=0;$('gio').innerHTML='';$('gio').hidden=false;$('m1').hidden=false;vong()}
function vong(){const c=CH[i];khoa=false;hienTien(CH.length,i);
 $('hoi1').innerHTML='Hái quả bầu có tiếng chứa vần <b>'+c.v+'</b>';
 $('day1').innerHTML=xao([c.ok,...c.no]).map(w=>qua(w)).join('');
 [...$('day1').children].forEach(b=>b.onclick=()=>bam(b));
 $('goiy').textContent='Câu '+(i+1)+'/'+CH.length+'. Đọc chữ trên từng quả bầu.';noi('Hái quả bầu có tiếng chứa vần.',c.v)}
async function bam(b){if(khoa)return;const c=CH[i],w=b.dataset.w;
 if(w===c.ok){khoa=true;b.classList.add('chin');b.querySelector('span').innerHTML=toVan(w,[boThanh(c.v)]);bip('dung');noi(w);const [x,y]=giua(b);phao(x,y,['🍃','⭐','✨'],9);
  $('gio').innerHTML+='<i>'+w+'</i>';await cho(1700);i++;if(i>=CH.length){bip('thang');return them()}vong()}
 else{sai++;bip('sai');b.classList.add('sai');noi(w);setTimeout(()=>b.classList.remove('sai'),600);$('goiy').textContent='Quả bầu này chưa có vần '+c.v+'. Chọn quả khác nhé!'}}
