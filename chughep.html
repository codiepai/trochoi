<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rừng Xanh Chữ Ghép - ôn ch tr th kh nh ph gi qu ng ngh g gh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>

[hidden]{display:none!important}
:root{--u:min(1vh,1.6vw);--chu:#12304a;--xanh:#0b5cab;--do:#e03131;--la:#2f9e44;--cam:#f08c00;--tim:#7048e8;--hong:#e64980;--font:"Baloo 2","Segoe UI",Arial,sans-serif;--emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);font-weight:800;color:var(--chu);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*1.2) 14px;gap:calc(var(--u)*.8);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer}
button:focus-visible{outline:5px solid var(--xanh);outline-offset:3px}
.top{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a{color:var(--xanh);text-decoration:none;font-size:max(15px,calc(var(--u)*2.8));background:#ffffffcc;border-radius:30px;padding:4px 14px}
.sao{background:#fff;border-radius:30px;padding:4px 16px;font-size:max(16px,calc(var(--u)*3));color:#b86200;box-shadow:0 3px 0 #0002}
h1{font-size:max(26px,calc(var(--u)*6.4));line-height:1.05;text-align:center;text-shadow:0 4px 0 #fff}
.goiy{font-size:max(18px,calc(var(--u)*3.8));text-align:center;color:var(--xanh);min-height:1.35em}
.tien{display:flex;gap:6px;justify-content:center}
.tien i{width:max(14px,calc(var(--u)*2.4));height:max(14px,calc(var(--u)*2.4));border-radius:50%;background:#fff;border:3px solid #0003}
.tien i.xong{background:var(--la);border-color:#1e6b2e}
.tien i.nay{background:#ffd43b;border-color:var(--cam)}
.nutlon{font-size:max(22px,calc(var(--u)*5));padding:.3em 1.1em;border:none;border-radius:20px;color:#fff;background:var(--cam);box-shadow:0 6px 0 #b86200}
.nutlon:active{transform:translateY(4px);box-shadow:0 2px 0 #b86200}
.phu{background:#fff;color:var(--xanh);box-shadow:0 6px 0 #9bb8d3}
#man{position:fixed;inset:0;background:#0b3a6acc;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#man .hop{background:#fff;border-radius:30px;padding:calc(var(--u)*3) calc(var(--u)*4);text-align:center;max-width:620px;box-shadow:0 10px 0 #0004}
#man h2{font-size:max(30px,calc(var(--u)*7));color:var(--xanh);line-height:1.05}
#man p{font-size:max(18px,calc(var(--u)*3.6));margin:.5em 0 .8em;font-weight:700}
#man .sao3{font-size:max(46px,calc(var(--u)*11));letter-spacing:.1em;margin:.1em 0}
#man .hang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bay{position:fixed;pointer-events:none;font-family:var(--emoji);z-index:60;animation:bay 1.3s ease-out forwards}
@keyframes bay{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.lac{animation:lac .4s}
@keyframes lac{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.nhun{animation:nhun .5s}
@keyframes nhun{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
em{font-style:normal;color:var(--do)}

body{background:#c8f0c0}
h1{color:#14401f}

body{background:url(anh-game/nen-rung-xanh.webp) center/cover fixed,url(../anh-game/nen-rung-xanh.webp) center/cover fixed,url(https://codiep-ai.netlify.app/anh-game/nen-rung-xanh.webp) center/cover fixed,#c8f0c0}
.ia{height:auto;max-width:100%;display:block}
.ie{font-family:var(--emoji)}
.san{width:100%;max-width:900px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);position:relative;z-index:1}
.man{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4)}
.hoi{background:#ffffffee;border-radius:22px;padding:calc(var(--u)*1.2) calc(var(--u)*3);box-shadow:0 6px 0 #0002;font-size:max(18px,calc(var(--u)*4.2));color:#14401f;text-align:center;max-width:820px}
.hoi b{color:#e8590c;font-size:1.4em}
.kh .ia{width:calc(var(--u)*14);min-width:64px;filter:drop-shadow(0 6px 4px #0003)}
.tu{background:#fffbe6;border:5px solid #f0c36d;border-radius:24px;padding:.05em .8em;font-size:max(34px,calc(var(--u)*11));color:#14401f;letter-spacing:.04em;box-shadow:0 7px 0 #0002;min-width:3em;text-align:center}
.tu i{font-style:normal;color:transparent;border-bottom:6px solid #e8590c;display:inline-block;min-width:1.5em;text-align:center}
.tu i.ok{color:#e8590c;border-bottom-color:transparent}
.nghe{width:calc(var(--u)*13);height:calc(var(--u)*13);min-width:64px;min-height:64px;border-radius:50%;border:calc(var(--u)*1.2) solid #0a9cf0;background:#fff;color:#0a9cf0;font-size:max(28px,calc(var(--u)*5.5));display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #0a6fb0;cursor:pointer;padding-left:.12em}
.nghe:active{transform:translateY(4px);box-shadow:0 3px 0 #0a6fb0}
.lc{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.8);justify-content:center}
.lc button{font-size:max(30px,calc(var(--u)*9));min-width:2.2em;padding:.1em .5em;border:none;border-radius:22px;color:#fff;background:#0b7285;box-shadow:0 8px 0 #064c59;cursor:pointer}
.lc button:nth-child(2){background:#e8590c;box-shadow:0 8px 0 #9c3a08}
.lc button:nth-child(3){background:#7048e8;box-shadow:0 8px 0 #4c2fb0}
.lc button:nth-child(4){background:#2f9e44;box-shadow:0 8px 0 #1e6b2e}
.lc button:active{transform:translateY(5px);box-shadow:0 3px 0 #0003}
.lc button.sai{background:#adb5bd!important;box-shadow:0 8px 0 #868e96!important;animation:lac .4s}
.lc button.dung{background:#2f9e44!important;box-shadow:0 8px 0 #1e6b2e!important}
.luat{background:#fff3bf;border-radius:18px;padding:calc(var(--u)*1) calc(var(--u)*2.4);font-size:max(16px,calc(var(--u)*3.4));color:#7a4b00;text-align:center;max-width:720px}
.qua{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.2) calc(var(--u)*1.6);width:100%;max-width:640px}
.q{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.q .ia{width:calc(var(--u)*15);min-width:64px;filter:drop-shadow(0 6px 4px #0003);transition:transform .25s}
.q .w{background:#fff;border-radius:16px;padding:.02em .6em;font-size:max(22px,calc(var(--u)*5.4));box-shadow:0 4px 0 #0002;color:#14401f}
.q.no .ia{transform:scale(1.12) rotate(-5deg);filter:drop-shadow(0 0 14px #ffd43b)}
.q.no{pointer-events:none}
.q.sai{animation:lac .4s}
.q.sai .w{background:#ffc9c9}
.rg{background:#ffffffcc;border-radius:30px;padding:.1em .9em;font-size:max(18px,calc(var(--u)*4));color:#14401f}

body{overflow-y:auto!important;justify-content:flex-start}
.hoi{font-size:max(17px,calc(var(--u)*3.6))!important;padding:calc(var(--u)*1) calc(var(--u)*2)!important}
.kh .ia{width:calc(var(--u)*9)!important;min-width:56px!important}
.nghe{width:calc(var(--u)*10)!important;height:calc(var(--u)*10)!important;min-width:58px!important;min-height:58px!important}
.lc{gap:calc(var(--u)*1.2)!important;flex-wrap:nowrap!important}
.lc button{font-size:max(26px,calc(var(--u)*6.5))!important;min-width:0!important;padding:.1em .45em!important;box-shadow:0 6px 0 #0003}
.tu{font-size:max(30px,calc(var(--u)*8.5))!important}
.q .ia{width:calc(var(--u)*11)!important;min-width:52px!important}
.q .w{font-size:max(18px,calc(var(--u)*4.4))!important}
.luat{font-size:max(15px,calc(var(--u)*3))!important}
.san{gap:calc(var(--u)*1)!important}.man{gap:calc(var(--u)*1)!important}

</style>
</head>
<body>
<div class="top"><span></span><span class="sao" id="tongSao"></span></div>
<h1>🌿 Rừng Xanh Chữ Ghép</h1>
<div class="goiy" id="goiy"></div>
<div class="tien" id="tien"></div>

<div class="san">
 <div class="man" id="m1" hidden><div class="hoi" id="hoi1"></div><div class="kh" id="kh1"></div><button class="nghe" id="ng1" aria-label="nghe">▶</button><div class="lc" id="lc1"></div></div>
 <div class="man" id="m2" hidden><div class="hoi" id="hoi2"></div><div class="tu" id="tu2"></div><button class="nghe" id="ng2" aria-label="nghe">▶</button><div class="lc" id="lc2"></div><div class="luat" id="luat2" hidden></div></div>
 <div class="man" id="m3" hidden><div class="hoi" id="hoi3"></div><div class="rg" id="rg3"></div><div class="qua" id="qua3"></div></div>
</div>

<div id="man" hidden><div class="hop"><h2></h2><p></p><div class="sao3"></div><div class="hang"><button class="nutlon" id="manOk">Bắt đầu</button></div></div></div>
<script>

const $=i=>document.getElementById(i);
const xao=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cho=ms=>new Promise(r=>setTimeout(r,ms));
const lsx=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let tongSao=parseInt(lsx('vuon-sao')||'0',10)||0; const hienSao=()=>{const e=$('tongSao');if(e)e.textContent='⭐ '+tongSao};
function congSao(n){tongSao+=n;lsx('vuon-sao',tongSao);hienSao()}
/* Doc tieng Viet: uu tien giong Viet co san trong may, khong co thi doc bang giong Viet truc tuyen (can mang) */
let viVoice=null;const layGiong=()=>{if(!window.speechSynthesis)return;viVoice=speechSynthesis.getVoices().filter(x=>/^vi[-_]?/i.test(x.lang)||/vietnam|tiếng việt/i.test(x.name))[0]||null};
if(window.speechSynthesis){layGiong();speechSynthesis.onvoiceschanged=layGiong}
let amDS=[],amTT=0;
function noi(...ds){amTT++;const tt=amTT;amDS.forEach(a=>a.pause());amDS=[];if(window.speechSynthesis)speechSynthesis.cancel();
 if(viVoice&&window.speechSynthesis){ds.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=viVoice.lang;u.voice=viVoice;u.rate=.8;speechSynthesis.speak(u)});return}
 (function tiep(i){if(i>=ds.length||tt!==amTT)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(ds[i]));amDS.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>tiep(i+1);const p=a.play();if(p&&p.catch)p.catch(()=>{})})(0)}
/* Tieng bip bang WebAudio (khong can file am thanh) */
let ac=null;function bip(loai){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=loai==='dung'?[[660,0],[880,.12],[1175,.24]]:loai==='sai'?[[220,0],[180,.14]]:loai==='thang'?[[523,0],[659,.13],[784,.26],[1047,.39],[1319,.52]]:[[600,0]];
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=loai==='sai'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
/* Phao hoa emoji */
function phao(x,y,ds,n){ds=ds||['⭐','✨','🎉','🌟'];n=n||14;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='bay';e.textContent=ds[i%ds.length];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(22+Math.random()*22)+'px';e.style.setProperty('--dx',((Math.random()-.5)*360)+'px');e.style.setProperty('--dy',(-60-Math.random()*260)+'px');e.style.setProperty('--r',((Math.random()-.5)*400)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
const giua=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* Man hinh bat dau / ket thuc */
function manHinh(tieude,loi,nut,cb,saoSo){const m=$('man');m.hidden=false;m.querySelector('h2').textContent=tieude;m.querySelector('p').textContent=loi;m.querySelector('.sao3').textContent=saoSo?'⭐'.repeat(saoSo)+'☆'.repeat(3-saoSo):'';$('manOk').textContent=nut;$('manOk').onclick=()=>{m.hidden=true;cb()}}
function hienTien(n,xong){$('tien').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<xong?'xong':i===xong?'nay':'')+'"></i>').join('')}
hienSao();
/* To do phan van trong tu: boThanh bo dau thanh (huyen sac hoi nga nang) tung chu, giu nguyen chu cai mu/ngang */
const boThanh=c=>c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC');
function toVan(w,vans){const ch=[...w],nm=ch.map(boThanh).join('').toLowerCase();let best=null;
 for(const v of vans){const k=nm.lastIndexOf(v);if(k>=0&&(best===null||v.length>best.v.length))best={k,v}}
 if(!best)return w;const n=[...best.v].length;return ch.slice(0,best.k).join('')+'<em>'+ch.slice(best.k,best.k+n).join('')+'</em>'+ch.slice(best.k+n).join('')}


const PFX=['anh-game/','../anh-game/','https://codiep-ai.netlify.app/anh-game/'];
function IA(s,e,c){return '<img class="ia '+(c||'')+'" src="'+PFX[0]+s+'.webp" data-s="'+s+'" data-e="'+(e||'')+'" data-t="0" onerror="aErr(this)" alt="">'}
function aErr(el){const t=+el.dataset.t+1;if(t<PFX.length){el.dataset.t=t;el.src=PFX[t]+el.dataset.s+'.webp';return}const sp=document.createElement('span');sp.className='ie';sp.style.fontSize='3em';sp.textContent=el.dataset.e||'';el.replaceWith(sp)}


/* AM THANH: uu tien file mp3 doc san (am/), roi giong may, cuoi cung Google */
function amKey(t){const s=String(t).normalize('NFC').toLowerCase().replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let _am=[],_tt=0;
noi=function(...ds){_tt++;const tt=_tt;_am.forEach(a=>{try{a.pause()}catch(e){}});_am=[];if(window.speechSynthesis)speechSynthesis.cancel();ds=ds.filter(Boolean);
 (function tiep(i){if(i>=ds.length||tt!==_tt)return;const t=ds[i],k=amKey(t),dc=['am/'+k+'.mp3','../am/'+k+'.mp3','https://codiep-ai.netlify.app/am/'+k+'.mp3'];let n=0;
  const thu=()=>{if(tt!==_tt)return;if(n>=dc.length)return gg(t,tt,()=>tiep(i+1));const a=new Audio(dc[n]);_am.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>{n++;thu()};const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError'){return}n++;thu()})};thu()})(0)};
function gg(t,tt,xong){if(window.speechSynthesis){const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));if(v){const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.8;u.onend=xong;speechSynthesis.speak(u);return}}
 const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(t));_am.push(a);a.onended=xong;a.onerror=xong;const p=a.play();if(p&&p.catch)p.catch(()=>{})}

/* ===== KHOI DU LIEU: co the sua cho bai khac ===== */
/* cach doc chu ghep khi co noi */
const DOC={ch:'chờ',tr:'trờ',th:'thờ',kh:'khờ',nh:'nhờ',ph:'phờ',gi:'giờ',qu:'quờ',ng:'ngờ',ngh:'ngờ kép',g:'gờ',gh:'gờ kép',c:'cờ',k:'ca'};
/* A: nghe tu, chon chu ghep dau tieng [tu, chu ghep dung, [lua chon sai]] */
const A=[['chó','ch',['tr','th']],['nhà','nh',['ng','kh']],['khỉ','kh',['ch','nh']],['phở','ph',['th','kh']],['thỏ','th',['tr','ch']],['quả','qu',['gi','kh']]];
/* B: dien chu ghep vao tu [phan sau, dap an, [lua chon], tu day du, luat hien khi sai] */
const B=[['ê','ngh',['ng','ngh','g'],'nghề','ng đứng trước a, o, ô, u, ư. ngh đứng trước e, ê, i.'],
         ['ế','gh',['g','gh','ng'],'ghế','g đứng trước a, o, ô, u, ư. gh đứng trước e, ê, i.'],
         ['à','g',['g','gh','ngh'],'gà','g đứng trước a, o, ô, u, ư. gh đứng trước e, ê, i.'],
         ['ô','ng',['ng','ngh','nh'],'ngô','ng đứng trước a, o, ô, u, ư. ngh đứng trước e, ê, i.'],
         ['ỉ','ngh',['ngh','ng','nh'],'nghỉ','ng đứng trước a, o, ô, u, ư. ngh đứng trước e, ê, i.'],
         ['i','gh',['g','gh','kh'],'ghi','g đứng trước a, o, ô, u, ư. gh đứng trước e, ê, i.']];
/* C: khi hai qua: moi vong 1 chu ghep, 3 tu dung + 3 tu sai */
const C=[{g:'tr',ok:['tre','trà','trâu'],no:['chè','thơ','khế']},
         {g:'ch',ok:['chó','chợ','chữ'],no:['trứng','thỏ','phở']},
         {g:'nh',ok:['nhà','nho','nhớ'],no:['ngà','khỉ','gió']}];
const TONG=3;let sai=0;
function vaoMan(k){['m1','m2','m3'].forEach((id,j)=>$(id).hidden=j!==k-1);hienTien(TONG,k-1);if(k===1)man1();else if(k===2)man2();else man3()}
function batDau(){sai=0;vaoMan(1)}

/* ===== Chang 1: nghe tu, chon chu ghep dung ===== */
let i1=0,khoa1=false;
function man1(){i1=0;cau1()}
function cau1(){khoa1=false;const q=A[i1];
 $('hoi1').innerHTML='Bấm ▶ nghe từ. Từ đó bắt đầu bằng chữ nào?';$('kh1').innerHTML=IA('rung-xanh-khi-nhay-mua','🐒');
 const ds=xao([q[1]].concat(q[2]));
 $('lc1').innerHTML=ds.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('');
 [...$('lc1').children].forEach(b=>b.onclick=()=>chon1(b,q));
 $('ng1').onclick=()=>noi(q[0]);
 $('goiy').textContent='Câu '+(i1+1)+'/'+A.length+'. Bấm ▶ nhiều lần cũng được.';setTimeout(()=>noi(q[0]),250)}
async function chon1(b,q){if(khoa1)return;const c=b.dataset.c;
 if(c===q[1]){khoa1=true;b.classList.add('dung');bip('dung');noi(q[0],DOC[c],q[0]);const [x,y]=giua(b);phao(x,y,['⭐','🍌','✨'],6);await cho(1600);i1++;if(i1>=A.length){bip('thang');return vaoMan(2)}cau1()}
 else{sai++;bip('sai');b.classList.add('sai');$('goiy').textContent='Chưa đúng. Nghe lại ▶ thật kỹ nhé!';setTimeout(()=>b.classList.remove('sai'),600)}}

/* ===== Chang 2: dien chu ghep vao tu ===== */
let i2=0,khoa2=false;
function man2(){i2=0;cau2()}
function cau2(){khoa2=false;const q=B[i2];
 $('hoi2').innerHTML='Điền chữ còn thiếu vào chỗ trống';$('luat2').hidden=true;
 $('tu2').innerHTML='<i id="cho2">__</i>'+q[0];
 const ds=xao(q[2].slice());
 $('lc2').innerHTML=ds.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('');
 [...$('lc2').children].forEach(b=>b.onclick=()=>chon2(b,q));
 $('ng2').onclick=()=>noi(q[3]);
 $('goiy').textContent='Câu '+(i2+1)+'/'+B.length+'. Bấm ▶ nghe từ rồi chọn chữ.';setTimeout(()=>noi(q[3]),250)}
async function chon2(b,q){if(khoa2)return;const c=b.dataset.c;
