<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quà Noel Gọi Tên - Trò chơi đầu giờ</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--u:min(1vh,1.6vw);--do:#d62828;--la:#1b7a3d;--vang:#ffd166;--font:"Baloo 2","Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:var(--font);font-weight:800;color:#fff;background:linear-gradient(#0b1d3a,#16365f 60%,#1d4a7a);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 14px 40px;gap:12px;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;font-weight:800;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:4px solid var(--vang);outline-offset:3px}
#tuyet{position:fixed;inset:0;pointer-events:none;z-index:1}
.bong{position:absolute;top:-10vh;color:#fff;animation:roi linear infinite;opacity:.9}
@keyframes roi{to{transform:translateY(115vh) translateX(var(--dx))}}
.dinh{position:fixed;left:0;right:0;bottom:0;height:7vh;background:linear-gradient(#fff,#dbe9f7);border-radius:50% 50% 0 0/100% 100% 0 0;z-index:0}
.cay{position:fixed;bottom:3vh;font-size:max(60px,14vh);z-index:0;opacity:.95}
.cay.t{left:2vw}.cay.p{right:2vw}
.wrap{position:relative;z-index:2;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:12px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button,.nho{border:none;border-radius:30px;padding:6px 16px;background:#ffffffdd;color:#0b3a6a;font-size:max(15px,calc(var(--u)*2.6))}
h1{font-size:max(30px,calc(var(--u)*7));text-align:center;line-height:1.05;color:var(--vang);text-shadow:0 4px 0 #8a1c1c}
.sub{font-size:max(16px,calc(var(--u)*3));text-align:center;color:#dbeafe;font-weight:700}
.hop{background:#fff;color:#12304a;border-radius:26px;padding:18px;width:100%;box-shadow:0 8px 0 #0006}
.hop label{display:block;font-size:max(16px,calc(var(--u)*3));margin-bottom:6px}
textarea{width:100%;min-height:30vh;border:4px solid #c9d6e6;border-radius:18px;padding:12px;font-family:inherit;font-weight:700;font-size:max(17px,calc(var(--u)*3.2));color:#fff;background:#12304a;text-shadow:0 1px 3px rgba(0,0,0,.6);caret-color:#ffd166;resize:vertical;user-select:text;-webkit-user-select:text}
.dong{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:10px;font-size:max(15px,calc(var(--u)*2.8));font-weight:700}
.dong select,.dong input[type=checkbox]{font:inherit}
.dong select{padding:4px 8px;border-radius:10px;border:3px solid #c9d6e6;font-weight:800}
.dong input[type=checkbox]{width:22px;height:22px;accent-color:var(--do)}
.lon{font-size:max(22px,calc(var(--u)*5));padding:.3em 1.2em;border:none;border-radius:22px;color:#fff;background:var(--do);box-shadow:0 7px 0 #8a1c1c}
.lon:active{transform:translateY(5px);box-shadow:0 2px 0 #8a1c1c}
.lon.xanh{background:var(--la);box-shadow:0 7px 0 #0d4a24}
.lon.phu{background:#fff;color:#0b3a6a;box-shadow:0 7px 0 #9bb8d3}
.bao{color:#b3261e;font-size:max(15px,calc(var(--u)*2.8));min-height:1.3em;text-align:center}
#choi{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.xe{font-size:max(40px,calc(var(--u)*8));animation:bay 3.2s ease-in-out infinite;line-height:1}
@keyframes bay{0%,100%{transform:translate(-30px,0) rotate(-4deg)}50%{transform:translate(30px,-12px) rotate(4deg)}}
.con{font-size:max(18px,calc(var(--u)*3.6));background:#ffffff22;border-radius:30px;padding:4px 18px}
.quaBox{font-size:max(84px,calc(var(--u)*20));line-height:1;border:none;background:none;filter:drop-shadow(0 10px 0 #0005);transition:transform .15s}
.quaBox:active{transform:scale(.92)}
.quaBox.lac{animation:lacqua .5s infinite}
@keyframes lacqua{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
#ten{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%;min-height:calc(var(--u)*16)}
.the{background:linear-gradient(#fff,#fff4d6);color:#8a1c1c;border-radius:26px;padding:.1em .7em;text-align:center;box-shadow:0 8px 0 #0006,0 0 0 6px var(--vang);font-size:max(44px,calc(var(--u)*13));line-height:1.25;animation:hien .6s cubic-bezier(.3,1.6,.5,1);max-width:100%;overflow-wrap:anywhere}
.the.nho2{font-size:max(30px,calc(var(--u)*8))}
.the.nhieu{font-size:max(24px,calc(var(--u)*6))}
.the.quay{color:#667;box-shadow:0 8px 0 #0006;animation:none}
@keyframes hien{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.da{width:100%;background:#0b1d3a99;border-radius:20px;padding:10px 14px}
.da h3{font-size:max(15px,calc(var(--u)*2.8));color:#dbeafe;margin-bottom:6px}
#ds{display:flex;flex-wrap:wrap;gap:6px}
#ds span{background:#ffffff;color:#1b7a3d;border-radius:14px;padding:.05em .6em;font-size:max(15px,calc(var(--u)*2.8))}
.bay2{position:fixed;pointer-events:none;z-index:60;animation:bayra 1.4s ease-out forwards;font-size:34px}
@keyframes bayra{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
#hetgio{position:fixed;inset:0;background:#0b1d3acc;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#hetgio .hop{max-width:520px;text-align:center}
#hetgio h2{font-size:max(30px,calc(var(--u)*7));color:var(--do)}
#hetgio p{font-size:max(18px,calc(var(--u)*3.6));margin:.5em 0 .8em;font-weight:700}
.hang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="tuyet" aria-hidden="true"></div>
<div class="cay t" aria-hidden="true">🎄</div><div class="cay p" aria-hidden="true">🎄</div><div class="dinh" aria-hidden="true"></div>

<div class="wrap">
 <div class="top"><button id="btnDS" hidden>✏️ Sửa danh sách</button><span></span><button id="btnAm">🔊 Đọc tên: Bật</button></div>
 <h1>🎅 Quà Noel Gọi Tên 🎁</h1>

 <!-- Màn nhập danh sách -->
 <div id="nhap" class="hop">
  <label for="dsText">Thầy cô dán danh sách học sinh vào đây (mỗi bạn một dòng, hoặc cách nhau bằng dấu phẩy):</label>
  <textarea id="dsText" placeholder="Nguyễn Minh An&#10;Trần Bảo Ngọc&#10;Lê Gia Huy&#10;..."></textarea>
  <div class="bao" id="bao"></div>
  <div class="dong">
   <label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" id="khongLap" checked> Không gọi lại bạn đã được gọi</label>
   <label style="margin:0;display:flex;gap:8px;align-items:center">Mỗi lần gọi
    <select id="soBan"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select> bạn</label>
  </div>
  <div class="dong">
   <button class="lon phu" id="btnMau">Dùng danh sách mẫu</button>
   <button class="lon xanh" id="btnBD">🎄 Bắt đầu chơi</button>
  </div>
  <div class="sub" style="color:#4a6078;margin-top:8px;font-weight:600">Danh sách chỉ lưu trên máy này, không gửi đi đâu. Lần sau mở lại vẫn còn.</div>
 </div>

 <!-- Màn chơi -->
 <div id="choi" hidden>
  <div class="xe" aria-hidden="true">🦌🦌🛷🎅</div>
  <div class="sub">Chạm vào hộp quà để ông già Noel gọi tên nhé!</div>
  <div class="con" id="con"></div>
  <button class="quaBox" id="qua" aria-label="Mở hộp quà gọi tên">🎁</button>
  <div id="ten" aria-live="polite"></div>
  <div class="da"><h3>Các bạn đã được gọi:</h3><div id="ds"></div></div>
  <div class="dong"><button class="lon phu" id="btnLai">🔄 Gọi lại từ đầu</button></div>
 </div>
</div>

<div id="hetgio" hidden><div class="hop"><h2>🎄 Đã gọi hết cả lớp!</h2><p>Ông già Noel đã gọi tên tất cả các bạn rồi. Chúc cả lớp một mùa Giáng sinh thật vui!</p><div class="hang"><button class="lon" id="btnTuDau">Gọi lại từ đầu</button><button class="lon phu" id="btnDong">Đóng</button></div></div></div>

<script>
const $=i=>document.getElementById(i);
const KHOA='noel-goi-ten-ds';
let tenList=[],conLai=[],daGoi=[],am=true,dangQuay=false;

/* tuyết rơi */
(function(){const t=$('tuyet');for(let i=0;i<40;i++){const s=document.createElement('span');s.className='bong';s.textContent=Math.random()<.5?'❄':'❅';s.style.left=Math.random()*100+'vw';s.style.fontSize=(10+Math.random()*22)+'px';s.style.animationDuration=(6+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*12)+'s';s.style.setProperty('--dx',(Math.random()*80-40)+'px');t.appendChild(s)}})();

/* âm thanh nhỏ */
let ac;function bip(k){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const seq=k==='mo'?[523,659,784,1047]:[330,392];seq.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*.11;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.3)})}catch(e){}}

/* đọc tên */
let giongVi=null;
function chonGiong(){const v=speechSynthesis.getVoices();giongVi=v.find(x=>/^vi([-_]|$)/i.test(x.lang))||null}
if('speechSynthesis' in window){chonGiong();speechSynthesis.onvoiceschanged=chonGiong}
let amGG=null;
function noi(text){
  if(!am)return;
  try{if(amGG){amGG.pause();amGG=null}}catch(e){}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  /* co giong tieng Viet trong may thi dung, khong thi dung giong Google (can mang), khong bao gio doc bang giong Anh */
  if(giongVi&&'speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(text);u.lang=giongVi.lang;u.voice=giongVi;u.rate=.85;speechSynthesis.speak(u);return;
  }
  try{
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(text));
    amGG=a;const p=a.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}

/* pháo hoa */
function phao(x,y,n){const E=['🎁','⭐','❄','🎄','🔔','✨'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='bay2';s.textContent=E[i%E.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*Math.PI*2,d=70+Math.random()*130;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}

/* đọc danh sách từ ô dán */
function tachDS(txt){
  return txt.split(/[\n\r;,\t]+/).map(s=>s.replace(/^\s*\d+\s*[\.\)\-:]\s*/,'').replace(/\s+/g,' ').trim()).filter(Boolean);
}
const MAU=['Nguyễn Minh An','Trần Bảo Ngọc','Lê Gia Huy','Phạm Khánh Linh','Hoàng Đức Anh','Võ Thanh Mai','Đặng Quốc Bảo','Bùi Ngọc Hân','Ngô Thảo Nguyên','Dương Tuấn Kiệt'];

function luu(){try{localStorage.setItem(KHOA,$('dsText').value)}catch(e){}}
function nap(){try{const s=localStorage.getItem(KHOA);if(s)$('dsText').value=s}catch(e){}}

function veDS(){
  $('ds').innerHTML=daGoi.map(n=>'<span>'+esc(n)+'</span>').join('')||'<span style="background:none;color:#9bb8d3;font-weight:600">Chưa gọi bạn nào</span>';
  const kl=$('khongLap').checked;
  $('con').textContent=kl?('Còn '+conLai.length+' / '+tenList.length+' bạn chưa được gọi'):('Lớp có '+tenList.length+' bạn');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function batDau(){
  tenList=tachDS($('dsText').value);
  if(tenList.length<1){$('bao').textContent='Thầy cô dán ít nhất một tên học sinh nhé.';return}
  $('bao').textContent='';luu();
  conLai=tenList.slice();daGoi=[];
  $('nhap').hidden=true;$('choi').hidden=false;$('btnDS').hidden=false;
  $('ten').innerHTML='';veDS();
}
function goiLai(){conLai=tenList.slice();daGoi=[];$('ten').innerHTML='';$('hetgio').hidden=true;veDS()}

function xao(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function boc(){
  if(dangQuay)return;
  const kl=$('khongLap').checked;
  if(kl&&conLai.length===0){$('hetgio').hidden=false;return}
  const soMuon=+$('soBan').value;
  const pool=kl?conLai:tenList;
  const n=Math.min(soMuon,pool.length);
  const chon=xao(pool).slice(0,n);
  dangQuay=true;
  const qua=$('qua');qua.classList.add('lac');
  const box=$('ten');box.innerHTML='';
  const cl=n>=4?' nhieu':(n>=2?' nho2':'');
  const the=[];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='the quay'+cl;box.appendChild(d);the.push(d)}
  let k=0;const t=setInterval(()=>{the.forEach(d=>d.textContent=tenList[Math.floor(Math.random()*tenList.length)]);bip('quay');k++},110);
  setTimeout(()=>{
    clearInterval(t);qua.classList.remove('lac');
    the.forEach((d,i)=>{d.className='the'+cl;d.textContent=chon[i]});
    bip('mo');
    const r=qua.getBoundingClientRect();phao(r.left+r.width/2,r.top+r.height/2,14);
    if(kl){chon.forEach(c=>{const j=conLai.indexOf(c);if(j>=0)conLai.splice(j,1)})}
    daGoi.push(...chon);veDS();
    noi(chon.join(', ')+' ơi!');
    dangQuay=false;
  },1500);
}

$('btnBD').onclick=batDau;
$('btnMau').onclick=()=>{$('dsText').value=MAU.join('\n')};
$('qua').onclick=boc;
$('btnLai').onclick=goiLai;
$('btnTuDau').onclick=goiLai;
$('btnDong').onclick=()=>{$('hetgio').hidden=true};
$('khongLap').onchange=veDS;
$('btnDS').onclick=()=>{$('choi').hidden=true;$('nhap').hidden=false;$('btnDS').hidden=true};
$('btnAm').onclick=()=>{am=!am;$('btnAm').textContent='🔊 Đọc tên: '+(am?'Bật':'Tắt');if(!am&&'speechSynthesis' in window)speechSynthesis.cancel()};
nap();
</script>
</body>
</html>
