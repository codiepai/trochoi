<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cầu Vồng Ước Mơ - Ôn tuần 13</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>

[hidden]{display:none!important}
:root{--u:min(1vh,1.6vw);--chu:#12304a;--xanh:#0b5cab;--do:#e03131;--la:#2f9e44;--cam:#f08c00;--tim:#7048e8;--hong:#e64980;--font:"Baloo 2","Segoe UI",Arial,sans-serif;--emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);font-weight:800;color:var(--chu);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*1.2) 14px;gap:calc(var(--u)*.8);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer}
button:focus-visible{outline:5px solid var(--xanh);outline-offset:3px}
.top{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a{color:var(--xanh);text-decoration:none;font-size:max(15px,calc(var(--u)*2.8));background:#ffffffcc;border-radius:30px;padding:4px 14px}
.sao{background:#fff;border-radius:30px;padding:4px 16px;font-size:max(16px,calc(var(--u)*3));color:#b86200;box-shadow:0 3px 0 #0002}
h1{font-size:max(26px,calc(var(--u)*6.4));line-height:1.05;text-align:center;text-shadow:0 4px 0 #fff}
.goiy{font-size:max(18px,calc(var(--u)*3.8));text-align:center;color:var(--xanh);min-height:1.35em}
.tien{display:flex;gap:6px;justify-content:center}
.tien i{width:max(14px,calc(var(--u)*2.4));height:max(14px,calc(var(--u)*2.4));border-radius:50%;background:#fff;border:3px solid #0003}
.tien i.xong{background:var(--la);border-color:#1e6b2e}
.tien i.nay{background:#ffd43b;border-color:var(--cam)}
.nutlon{font-size:max(22px,calc(var(--u)*5));padding:.3em 1.1em;border:none;border-radius:20px;color:#fff;background:var(--cam);box-shadow:0 6px 0 #b86200}
.nutlon:active{transform:translateY(4px);box-shadow:0 2px 0 #b86200}
.phu{background:#fff;color:var(--xanh);box-shadow:0 6px 0 #9bb8d3}
#man{position:fixed;inset:0;background:#0b3a6acc;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#man .hop{background:#fff;border-radius:30px;padding:calc(var(--u)*3) calc(var(--u)*4);text-align:center;max-width:620px;box-shadow:0 10px 0 #0004}
#man h2{font-size:max(30px,calc(var(--u)*7));color:var(--xanh);line-height:1.05}
#man p{font-size:max(18px,calc(var(--u)*3.6));margin:.5em 0 .8em;font-weight:700}
#man .sao3{font-size:max(46px,calc(var(--u)*11));letter-spacing:.1em;margin:.1em 0}
#man .hang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bay{position:fixed;pointer-events:none;font-family:var(--emoji);z-index:60;animation:bay 1.3s ease-out forwards}
@keyframes bay{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.lac{animation:lac .4s}
@keyframes lac{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.nhun{animation:nhun .5s}
@keyframes nhun{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
em{font-style:normal;color:var(--do)}

h1{color:#7048e8}

body{background:url(anh-game/nen-canh-dong-hoa.webp) center bottom/cover fixed,url(../anh-game/nen-canh-dong-hoa.webp) center bottom/cover fixed,url(https://codiep-ai.netlify.app/anh-game/nen-canh-dong-hoa.webp) center bottom/cover fixed,#cdeeff}
html,body{height:auto;min-height:100%}
body{overflow-y:auto;gap:calc(var(--u)*.6);padding-bottom:calc(var(--u)*4)}
h1{color:#7048e8!important}
.goiy{color:#0b3a6a;background:#ffffffcc;border-radius:20px;padding:0 .8em}
.ia{height:auto;max-width:100%;display:block}
.ie{font-family:var(--emoji)}
#cv{width:calc(var(--u)*23);min-width:150px;display:block;flex:none;filter:drop-shadow(0 3px 3px #0002)}
#cv path{fill:none;stroke-width:7.4;stroke:#fff;opacity:.55;transition:stroke .8s,opacity .8s}
.san{overflow-x:clip;width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.man{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6)}
.hoi{background:#fffbe6f5;border-radius:22px;padding:calc(var(--u)*.8) calc(var(--u)*2.4);box-shadow:0 5px 0 #0003;font-size:max(18px,calc(var(--u)*3.8));color:#4a3200;text-align:center;max-width:860px;display:flex;align-items:center;justify-content:center;gap:.6em}
.hoi b{color:#e03131;font-size:1.35em}
.loa{flex:none;width:max(44px,calc(var(--u)*6.4));height:max(44px,calc(var(--u)*6.4));border-radius:50%;border:4px solid #0a9cf0;background:#fff;color:#0a9cf0;font-size:max(17px,calc(var(--u)*2.8));padding:0 0 0 .12em}
/* chang 1 */
.may{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.6) calc(var(--u)*3);justify-items:center}
.dm{border:none;background:none;padding:0;position:relative;width:min(29vw,calc(var(--u)*25));transform-origin:50% 50%;animation:troi 3.4s ease-in-out infinite}
.dm:nth-child(2n){animation-delay:-1.6s}.dm:nth-child(3n){animation-delay:-.7s}
@keyframes troi{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}
.dm .ia{width:100%;aspect-ratio:13/10;object-fit:fill;filter:drop-shadow(0 6px 5px #0003)}
.dm .w{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffffff0;border-radius:14px;padding:0 .35em;font-size:min(5.8vw,calc(var(--u)*5.2));color:#24115c;white-space:nowrap;box-shadow:0 3px 0 #0003}
.dm.dung{animation:nhun .5s;pointer-events:none}
.dm.dung .ia{filter:hue-rotate(-60deg) saturate(1.5) drop-shadow(0 0 14px #4dabf7)}
.dm.dung .w{background:#d3f9d8}
.dm.sai{animation:lac .4s}
.dm.sai .ia{filter:grayscale(1)}
.giot{position:fixed;width:9px;height:15px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#339af0;pointer-events:none;z-index:20;animation:roi 1s ease-in forwards}
@keyframes roi{to{transform:translateY(110px);opacity:0}}
.vuon{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:calc(var(--u)*6)}
.vuon .ia{width:calc(var(--u)*5.6);min-width:30px;animation:nhun .6s}
/* chang 2 */
.pt{background:#fffbe6f5;border-radius:20px;padding:0 calc(var(--u)*3);font-size:max(30px,calc(var(--u)*7.4));color:#12304a;box-shadow:0 5px 0 #0003;text-align:center}
.pt b{color:#e03131}
.pt small{display:block;font-size:.5em;color:#2b8a3e;min-height:1.3em;margin-top:-.2em}
.dan{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*.8) calc(var(--u)*2.2);justify-items:center}
.bb{border:none;background:none;padding:0;width:min(16vw,calc(var(--u)*13));transition:transform 1s ease-in,opacity 1s}
.bb .ia{width:100%;animation:vay 1.1s ease-in-out infinite}
@keyframes vay{50%{transform:scaleX(.82)}}
.bb.bay1{transform:translate(40px,-220px) rotate(25deg);opacity:0;pointer-events:none}
.nbs{display:flex;flex-wrap:wrap;gap:calc(var(--u)*2.4);justify-content:center}
.nb{font-size:max(26px,calc(var(--u)*6.4));min-width:calc(var(--u)*13);padding:.05em .5em;border:none;border-radius:20px;color:#fff;background:#e8590c;box-shadow:0 6px 0 #9c3a08}
.nb:nth-child(3n+2){background:#0b7285;box-shadow:0 6px 0 #064c59}
.nb:nth-child(3n){background:#7048e8;box-shadow:0 6px 0 #4c2fb0}
.nb:active{transform:translateY(4px)}
.nb.sai{background:#adb5bd;box-shadow:0 6px 0 #868e96;animation:lac .4s}
.nb.dung{background:#2f9e44;box-shadow:0 6px 0 #1e6b2e}
.hoas{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.8) calc(var(--u)*4);justify-items:center}
.bh{border:none;background:none;padding:0;position:relative;width:min(27vw,calc(var(--u)*16));transition:transform .25s}
.bh .ia{width:100%}
.bh span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:0 .3em;font-size:max(17px,calc(var(--u)*3.8));white-space:nowrap;color:#12304a;box-shadow:0 3px 0 #0004}
.bh.chon{transform:scale(1.18);filter:drop-shadow(0 0 14px #ffd43b)}
.bh.da{visibility:hidden}
.los{display:flex;gap:calc(var(--u)*3);justify-content:center}
.lo{border:none;background:none;padding:0;position:relative;width:min(29vw,calc(var(--u)*18));display:flex;flex-direction:column;align-items:center}
.lo .cm{display:flex;justify-content:center;min-height:calc(var(--u)*6);margin-bottom:-6px}
.lo .cm .ia{width:calc(var(--u)*7);min-width:38px;margin:0 -4px}
.lo>.ia{width:78%}
.lo .so{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);background:#e03131;color:#fff;border-radius:14px;padding:0 .55em;font-size:max(24px,calc(var(--u)*5.6));box-shadow:0 4px 0 #8f1d1d}
.lo.sai{animation:lac .4s}
.bang{background:#fffbe6f5;border-radius:24px;border:5px solid #f0b429;padding:calc(var(--u)*.8) calc(var(--u)*5);box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.bang h3{font-size:max(19px,calc(var(--u)*3.6));color:#7048e8;text-align:center}
.dong{display:flex;align-items:center;justify-content:center;gap:.35em;font-size:max(23px,calc(var(--u)*4.6));color:#12304a}
.dong .o{min-width:2.1em;text-align:center;border-radius:12px;background:#e7f5ff;line-height:1.25}
.dong .o.an{background:#fff;border:3px dashed #adb5bd;color:#868e96}
.dong .o.nay{border:4px solid #e8590c;background:#fff4e6;color:#e8590c;animation:nhip 1s infinite}
@keyframes nhip{50%{transform:scale(1.12)}}
.dong .o.dung{background:#b2f2bb;border:none;color:#12304a}
.pad{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;width:min(100%,760px)}
.pad .nb{min-width:0;padding:0;font-size:max(22px,calc(var(--u)*4.6));border-radius:14px}
@media (max-width:620px){.pad{grid-template-columns:repeat(6,1fr);gap:8px}}
/* chang 3 */
.the{background:#fffbe6f5;border-radius:28px;padding:calc(var(--u)*1.4) calc(var(--u)*3);box-shadow:0 7px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);width:min(100%,820px)}
.chu{font-size:max(32px,calc(var(--u)*7.6));color:#c2255c;text-align:center;line-height:1.15}
.doan{background:#fff6bf;border:4px solid #f0c419;border-radius:20px;padding:.2em .8em;font-size:max(19px,calc(var(--u)*3.8));line-height:1.45;color:#222;text-align:center}
.chon{display:flex;gap:calc(var(--u)*7);justify-content:center}
.opt{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4)}
.opt .radio{width:max(42px,calc(var(--u)*5.6));height:max(42px,calc(var(--u)*5.6));border-radius:50%;border:5px solid #adb5bd;background:#fff}
.opt .radio.dung{background:#2f9e44;border-color:#1e6b2e}
.opt .radio.sai{background:#e03131;border-color:#a61e1e;animation:lac .4s}
.nut-nghe{width:max(70px,calc(var(--u)*11.5));height:max(70px,calc(var(--u)*11.5));border-radius:50%;border:calc(var(--u)*1.1) solid #0a9cf0;background:#fff;color:#0a9cf0;font-size:max(28px,calc(var(--u)*5));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0a6fb0;padding:0 0 0 .12em}
.nut-nghe:active{transform:translateY(4px);box-shadow:0 2px 0 #0a6fb0}
.khung2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;background:#fff;border-radius:18px;border-bottom:7px solid #e8a33d;width:100%}
.khung2 span{font-size:max(21px,calc(var(--u)*4.4));background:#d3f9d8;border-radius:14px;padding:.05em .45em}
.khung2 span.trong{background:#f1f3f5;color:transparent;min-width:2.2em}
.khay{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.4);justify-content:center}
.khay .nb{font-size:max(21px,calc(var(--u)*4.4));min-width:0}
.khay .nb.da{visibility:hidden}
.kb{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6)}
@media (max-width:620px){h1{font-size:25px}.goiy{font-size:15px}#cv{width:130px;min-width:0}.hoi{font-size:17px}.dong{font-size:22px}.bang h3{font-size:17px}.the .nb{font-size:22px}.the{gap:8px}.doan{font-size:18px}}
@media (min-aspect-ratio:5/4){.kb{flex-direction:row;align-items:center;gap:calc(var(--u)*5)}.kb .pad{grid-template-columns:repeat(4,1fr);width:auto;gap:10px}.kb .pad .nb{min-width:max(52px,calc(var(--u)*9))}}
@media (min-aspect-ratio:5/4){.the{gap:calc(var(--u)*1)}.the .nut-nghe{width:max(64px,calc(var(--u)*10));height:max(64px,calc(var(--u)*10))}.the>.nb{font-size:max(20px,calc(var(--u)*4))}.lo .cm{min-height:calc(var(--u)*5)}body{gap:calc(var(--u)*.3);padding-top:4px}h1{font-size:max(24px,calc(var(--u)*5))}#cv{width:calc(var(--u)*17);min-width:100px}.man{gap:calc(var(--u)*1)}.bh{width:calc(var(--u)*13.5)}.lo{width:calc(var(--u)*16)}.bb{width:calc(var(--u)*11)}}

</style>
</head>
<body>
<div class="top"><span></span><span class="sao" id="tongSao"></span></div>
<h1>🌈 Cầu Vồng Ước Mơ</h1>
<div class="goiy" id="goiy"></div>
<div class="tien" id="tien"></div>

<svg id="cv" viewBox="0 0 200 104" aria-hidden="true"></svg>
<div class="san">
 <div class="man" id="m1" hidden><div class="hoi"><button class="loa" id="loa1" aria-label="nghe câu hỏi">▶</button><span id="hoi1"></span></div><div class="may" id="may"></div><div class="vuon" id="vuon"></div></div>
 <div class="man" id="m2" hidden><div class="hoi"><button class="loa" id="loa2" aria-label="nghe câu hỏi">▶</button><span id="hoi2"></span></div><div class="man" id="khu2"></div></div>
 <div class="man" id="m3" hidden><div class="the" id="the"></div></div>
</div>

<div id="man" hidden><div class="hop"><h2></h2><p></p><div class="sao3"></div><div class="hang"><button class="nutlon" id="manOk">Bắt đầu</button></div></div></div>
<script>

const $=i=>document.getElementById(i);
const xao=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cho=ms=>new Promise(r=>setTimeout(r,ms));
const lsx=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let tongSao=parseInt(lsx('vuon-sao')||'0',10)||0; const hienSao=()=>{const e=$('tongSao');if(e)e.textContent='⭐ '+tongSao};
function congSao(n){tongSao+=n;lsx('vuon-sao',tongSao);hienSao()}
/* Doc tieng Viet: uu tien giong Viet co san trong may, khong co thi doc bang giong Viet truc tuyen (can mang) */
let viVoice=null;const layGiong=()=>{if(!window.speechSynthesis)return;viVoice=speechSynthesis.getVoices().filter(x=>/^vi[-_]?/i.test(x.lang)||/vietnam|tiếng việt/i.test(x.name))[0]||null};
if(window.speechSynthesis){layGiong();speechSynthesis.onvoiceschanged=layGiong}
let amDS=[],amTT=0;
function noi(...ds){amTT++;const tt=amTT;amDS.forEach(a=>a.pause());amDS=[];if(window.speechSynthesis)speechSynthesis.cancel();
 if(viVoice&&window.speechSynthesis){ds.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=viVoice.lang;u.voice=viVoice;u.rate=.8;speechSynthesis.speak(u)});return}
 (function tiep(i){if(i>=ds.length||tt!==amTT)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(ds[i]));amDS.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>tiep(i+1);const p=a.play();if(p&&p.catch)p.catch(()=>{})})(0)}
/* Tieng bip bang WebAudio (khong can file am thanh) */
let ac=null;function bip(loai){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=loai==='dung'?[[660,0],[880,.12],[1175,.24]]:loai==='sai'?[[220,0],[180,.14]]:loai==='thang'?[[523,0],[659,.13],[784,.26],[1047,.39],[1319,.52]]:[[600,0]];
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=loai==='sai'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
/* Phao hoa emoji */
function phao(x,y,ds,n){ds=ds||['⭐','✨','🎉','🌟'];n=n||14;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='bay';e.textContent=ds[i%ds.length];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(22+Math.random()*22)+'px';e.style.setProperty('--dx',((Math.random()-.5)*360)+'px');e.style.setProperty('--dy',(-60-Math.random()*260)+'px');e.style.setProperty('--r',((Math.random()-.5)*400)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
const giua=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* Man hinh bat dau / ket thuc */
function manHinh(tieude,loi,nut,cb,saoSo){const m=$('man');m.hidden=false;m.querySelector('h2').textContent=tieude;m.querySelector('p').textContent=loi;m.querySelector('.sao3').textContent=saoSo?'⭐'.repeat(saoSo)+'☆'.repeat(3-saoSo):'';$('manOk').textContent=nut;$('manOk').onclick=()=>{m.hidden=true;cb()}}
function hienTien(n,xong){$('tien').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<xong?'xong':i===xong?'nay':'')+'"></i>').join('')}
hienSao();
/* To do phan van trong tu: boThanh bo dau thanh (huyen sac hoi nga nang) tung chu, giu nguyen chu cai mu/ngang */
const boThanh=c=>c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC');
function toVan(w,vans){const ch=[...w],nm=ch.map(boThanh).join('').toLowerCase();let best=null;
 for(const v of vans){const k=nm.lastIndexOf(v);if(k>=0&&(best===null||v.length>best.v.length))best={k,v}}
 if(!best)return w;const n=[...best.v].length;return ch.slice(0,best.k).join('')+'<em>'+ch.slice(best.k,best.k+n).join('')+'</em>'+ch.slice(best.k+n).join('')}


/* AM THANH: uu tien file mp3 doc san (am/), roi giong may, cuoi cung Google */
function amKey(t){const s=String(t).normalize('NFC').toLowerCase().replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let _am=[],_tt=0;
noi=function(...ds){_tt++;const tt=_tt;_am.forEach(a=>{try{a.pause()}catch(e){}});_am=[];if(window.speechSynthesis)speechSynthesis.cancel();ds=ds.filter(Boolean);

  let lan='?';try{if(typeof sai==='number')lan=sai}catch(e){}
  const d={lop,ten:HS.ten+' (lớp '+HS.lop+')',bai:TEN_BAI,dungLanDau:sao,soCau:3,chiTiet:'Sao: '+sao+'/3; số lần sai: '+lan+(window.DIEM?'; Điểm: '+window.DIEM:'')};
  fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)})
   .then(()=>ghiChu('Đã gửi kết quả cho cô.'),()=>ghiChu('Chưa gửi được. '+CHUP))}
 const mh=manHinh;
 manHinh=function(tieude,loi,nut,cb,saoSo){go();mh(tieude,loi,nut,cb,saoSo);if(saoSo)gui(saoSo)};
 window.__hsGui=gui;
 if(!/[?&]gb=1/.test(location.search))chen();
})();
