<script>

const $=i=>document.getElementById(i);

let tongSao=parseInt(lsx('vuon-sao')||'0',10)||0; const hienSao=()=>{const e=$('tongSao');if(e)e.textContent='⭐ '+tongSao};
function congSao(n){tongSao+=n;lsx('vuon-sao',tongSao);hienSao()}
/* Doc tieng Viet: uu tien giong Viet co san trong may, khong co thi doc bang giong Viet truc tuyen (can mang) */
let viVoice=null;const layGiong=()=>{if(!window.speechSynthesis)return;viVoice=speechSynthesis.getVoices().filter(x=>/^vi[-_]?/i.test(x.lang)||/vietnam|tiếng việt/i.test(x.name))[0]||null};
if(window.speechSynthesis){layGiong();speechSynthesis.onvoiceschanged=layGiong}
let amDS=[],amTT=0;
function noi(...ds){amTT++;const tt=amTT;amDS.forEach(a=>a.pause());amDS=[];if(window.speechSynthesis)speechSynthesis.cancel();
 if(viVoice&&window.speechSynthesis){ds.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=viVoice.lang;u.voice=viVoice;u.rate=.8;speechSynthesis.speak(u)});return}
 (function tiep(i){if(i>=ds.length||tt!==amTT)return;const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(ds[i]));amDS.push(a);a.onended=()=>tiep(i+1);a.onerror=()=>tiep(i+1);const p=a.play();if(p&&p.catch)p.catch(()=>{})})(0)}
/* Tieng bip bang WebAudio (khong can file am thanh) */
let ac=null;function bip(loai){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=loai==='dung'?[[660,0],[880,.12],[1175,.24]]:loai==='sai'?[[220,0],[180,.14]]:loai==='thang'?[[523,0],[659,.13],[784,.26],[1047,.39],[1319,.52]]:[[600,0]];
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=loai==='sai'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
/* Phao hoa emoji */
function phao(x,y,ds,n){ds=ds||['⭐','✨','🎉','🌟'];n=n||14;for(let i=0;i<n;i++){const e=document.createElement('div');e.className='bay';e.textContent=ds[i%ds.length];e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(22+Math.random()*22)+'px';e.style.setProperty('--dx',((Math.random()-.5)*360)+'px');e.style.setProperty('--dy',(-60-Math.random()*260)+'px');e.style.setProperty('--r',((Math.random()-.5)*400)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
const giua=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* Man hinh bat dau / ket thuc */
function manHinh(tieude,loi,nut,cb,saoSo){const m=$('man');m.hidden=false;m.querySelector('h2').textContent=tieude;m.querySelector('p').textContent=loi;m.querySelector('.sao3').textContent=saoSo?'⭐'.repeat(saoSo)+'☆'.repeat(3-saoSo):'';$('manOk').textContent=nut;$('manOk').onclick=()=>{m.hidden=true;cb()}}
function hienTien(n,xong){$('tien').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<xong?'xong':i===xong?'nay':'')+'"></i>').join('')}
hienSao();
/* To do phan van trong tu: boThanh bo dau thanh (huyen sac hoi nga nang) tung chu, giu nguyen chu cai mu/ngang */
const boThanh=c=>c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC');
function toVan(w,vans){const ch=[...w],nm=ch.map(boThanh).join('').toLowerCase();let best=null;
 for(const v of vans){const k=nm.lastIndexOf(v);if(k>=0&&(best===null||v.length>best.v.length))best={k,v}}
 if(!best)return w;const n=[...best.v].length;return ch.slice(0,best.k).join('')+'<em>'+ch.slice(best.k,best.k+n).join('')+'</em>'+ch.slice(best.k+n).join('')}


const PFX=['anh-game/','../anh-game/','https://codiep-ai.netlify.app/anh-game/'];
function IA(s,e,c){return '<img class="ia '+(c||'')+'" src="'+PFX[0]+s+'.webp" data-s="'+s+'" data-e="'+(e||'')+'" data-t="0" onerror="aErr(this)" alt="">'}
function aErr(el){const t=+el.dataset.t+1;if(t<PFX.length){el.dataset.t=t;el.src=PFX[t]+el.dataset.s+'.webp';return}const sp=document.createElement('span');sp.className='ie';sp.style.fontSize='3em';sp.textContent=el.dataset.e||'';el.replaceWith(sp)}
function amKey(t){const s=String(t).normalize('NFC').toLowerCase().replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let _am=[],_tt=0;
noi=function(...ds){_tt++;const tt=_tt;_am.forEach(a=>{try{a.pause()}catch(e){}});_am=[];if(window.speechSynthesis)speechSynthesis.cancel();ds=ds.filter(Boolean);
 (function tiep(i){if(i>=ds.length||tt!==_tt)return;const t=ds[i],k=amKey(t),dc=['am/'+k+'.mp3','../am/'+k+'.mp3','https://codiep-ai.netlify.app/am/'+k+'.mp3'];let n=0;
  const thu=()=>{if(tt!==_tt)return;if(n>=dc.length)return gg(t,tt,()=>tiep(i+1));const a=new Audio(dc[n]);_am.push(a);let xg=false;const sang=()=>{if(xg)return;xg=true;n++;thu()};a.onended=()=>{if(!xg){xg=true;tiep(i+1)}};a.onerror=sang;const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError'){xg=true;return}sang()})};thu()})(0)};
function gg(t,tt,xong){if(window.speechSynthesis){const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));if(v){const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.8;u.onend=xong;speechSynthesis.speak(u);return}}
 const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(t));_am.push(a);a.onended=xong;a.onerror=xong;const p=a.play();if(p&&p.catch)p.catch(()=>{})}

/* ===== KHOI DU LIEU: [tu nghe, dap an dung, [cac lua chon], goi y khi sai] ===== */
const A=[['hát','at',['at','ac'],'t: lưỡi chạm răng. c: lưỡi rút về sau.'],
         ['cốc','ôc',['ôt','ôc'],'t: lưỡi chạm răng. c: lưỡi rút về sau.'],
         ['bài','ai',['ai','ay'],'ai: miệng mở rộng rồi kéo lên. ay: miệng hơi tròn.'],
         ['máy','ay',['ai','ay'],'ai: miệng mở rộng rồi kéo lên. ay: miệng hơi tròn.'],
         ['sao','ao',['ao','au'],'ao: kết thúc tròn môi o. au: kết thúc tròn môi u.'],
         ['rau','au',['ao','au'],'ao: kết thúc tròn môi o. au: kết thúc tròn môi u.']];
const B=[['chợ','ch',['ch','tr'],'ch và tr nghe gần giống nhau. Nhìn miệng cô: ch.'],
         ['tre','tr',['ch','tr'],'ch và tr nghe gần giống nhau. Nhìn miệng cô: tr.'],
         ['sẻ','s',['s','x'],'s và x: nghe kỹ, nhớ cả hình chữ.'],
         ['xe','x',['s','x'],'s và x: nghe kỹ, nhớ cả hình chữ.'],
         ['bò','b',['b','d'],'b có bụng ở phía sau, d có bụng ở phía trước.'],
         ['dê','d',['b','d'],'b có bụng ở phía sau, d có bụng ở phía trước.']];
const C=[['bạn','an',['an','ăn','ân'],'Nghe kỹ âm trước chữ n: an, ăn hay ân.'],
         ['khăn','ăn',['an','ăn','ân'],'Nghe kỹ âm trước chữ n: an, ăn hay ân.'],
         ['mận','ân',['an','ăn','ân'],'Nghe kỹ âm trước chữ n: an, ăn hay ân.'],
         ['con','on',['on','ôn','ơn'],'Nghe kỹ âm trước chữ n: on, ôn hay ơn.'],
         ['chồn','ôn',['on','ôn','ơn'],'Nghe kỹ âm trước chữ n: on, ôn hay ơn.'],
         ['sơn','ơn',['on','ôn','ơn'],'Nghe kỹ âm trước chữ n: on, ôn hay ơn.']];
const CH=[
 {ten:'Chặng 1: vần cuối, hai hành tinh',hoi:'Nghe từ. Từ đó có vần nào?',Q:A},
 {ten:'Chặng 2: chữ đứng đầu',hoi:'Nghe từ. Từ đó bắt đầu bằng chữ nào?',Q:B},
 {ten:'Chặng 3: ba vần dễ nhầm',hoi:'Nghe từ. Từ đó có vần nào?',Q:C}];

CH.splice(0,CH.length,CH[2]);const TONG=1;let sai=0,cg=0,ic=0,khoa=false;
function ve(){$('tl').innerHTML='<div class="xe" id="xe" style="left:'+Math.round(100*(cg*6+ic)/(6*CH.length))+'%">'+IA('vu-tru-ten-lua-do','🚀')+'</div>'}
function vaoMan(k){cg=k-1;ic=0;$('m1').hidden=false;hienTien(TONG,k-1);cau()}

function cau(){khoa=false;const C0=CH[cg],q=C0.Q[ic];ve();
 $('hoi1').innerHTML=C0.hoi;$('ph1').innerHTML=IA(ic%2?'vu-tru-phi-hanh-gia-be-gai':'vu-tru-phi-hanh-gia-be-trai','👩‍🚀');$('luat1').hidden=true;
 const ds=xao(q[2].slice());
 $('hp1').innerHTML=ds.map((c,k)=>'<button data-c="'+c+'">'+IA(HT[(k+cg+ic)%4],'🪐')+'<span class="t">'+c+'</span></button>').join('');
 [...$('hp1').children].forEach(b=>b.onclick=()=>chon(b,q));
 $('ng1').onclick=()=>noi(q[0]);
 $('goiy').textContent=C0.ten+'. Câu '+(ic+1)+'/6. Bấm ▶ nghe lại nhiều lần cũng được.';setTimeout(()=>noi(q[0]),300)}
async function chon(b,q){if(khoa)return;const c=b.dataset.c;
 if(c===q[1]){khoa=true;b.classList.add('dung');bip('dung');noi(q[0]);const [x,y]=giua(b);phao(x,y,['⭐','✨','🚀'],6);await cho(1500);ic++;
  if(ic>=6){if(cg>=CH.length-1){bip('thang');return ketThuc()}bip('thang');return vaoMan(cg+2)}cau()}
 else{sai++;bip('sai');b.classList.add('sai');setTimeout(()=>b.classList.remove('sai'),600);const L=$('luat1');L.textContent='Nhớ nhé: '+q[3];L.hidden=false;$('goiy').textContent='Chưa đúng. Nghe lại ▶ rồi chọn hành tinh khác.'}}
function ketThuc(){hienTien(TONG,TONG);const sao=sai<=1?3:sai<=3?2:1;congSao(sao);bip('thang');phao(innerWidth/2,innerHeight/2,['🚀','🪐','⭐','🎉'],26);
 manHinh('Phi thuyền đã tới đích!','Con đã nghe và chọn đúng vần, chữ dễ nhầm. Con làm sai '+sai+' lần.','Chơi lại',batDau,sao)}
manHinh('Phi Thuyền Ba Vần','Cùng phi hành gia nghe từ và chọn đúng vần trong ba vần dễ nhầm. Chỉ 6 câu thôi.','Bắt đầu',batDau);

</script>
<script>

(function(){
 const SHEET='https://script.google.com/macros/s/AKfycbzE5tlog_osSNJ7Tsr4SnJPQCiv5LpyfQaDj8jNHNYzT9YEMGnQHTJrrpNXV_45lq1t/exec';

 const chuanLop=s=>String(s||'').replace(/\s+/g,'').replace(/[,\/\-]/g,'.').toUpperCase();

 const st=document.createElement('style');
 st.textContent='#hs-khung{margin:.3em 0 .6em}#hs-khung label{display:block;text-align:left;font-size:16px;margin:.4em 0 .1em;color:#12304a}#hs-khung input{width:100%;font:inherit;font-weight:700;font-size:20px;padding:.35em .6em;border:3px solid #74c0fc;border-radius:14px;text-align:center;color:#12304a;background:#fff}#hs-khung input:focus{outline:4px solid #ffd43b}#hs-loi{color:#e03131;font-size:16px;min-height:1.3em;margin:.2em 0 0}';
 document.head.appendChild(st);
 function go(){const d=$('hs-khung');if(d)d.remove()}
 function chen(){
  const hop=document.querySelector('#man .hop');if(!hop||$('hs-khung'))return;
  const d=document.createElement('div');d.id='hs-khung';
  d.innerHTML='<label for="hs-ten">Họ tên và lớp của con (viết trên một dòng)</label><input id="hs-ten" type="text" maxlength="50" autocomplete="off" placeholder="Nguyễn Minh An, 1/14"><p id="hs-loi"></p>';
  hop.insertBefore(d,hop.querySelector('.hang'));
  $('hs-ten').value=ls('hs-ten');
  $('hs-ten').addEventListener('keydown',e=>{if(e.key==='Enter')$('manOk').click()});
  const ok=$('manOk'),goc=ok.onclick;
  ok.onclick=()=>{const v=$('hs-ten').value.trim().replace(/\s+/g,' '),i=Math.max(v.lastIndexOf(','),v.lastIndexOf(';'));
   const t=i>0?v.slice(0,i).trim():'',l=i>0?v.slice(i+1).trim():'';
   if(t.length<2||!/\d/.test(l)){$('hs-loi').textContent='Con ghi họ tên, dấu phẩy, rồi lớp nhé. Ví dụ: Nguyễn Minh An, 1/14';$('hs-ten').focus();return}
   HS.ten=t;HS.lop=l;ls('hs-ten',v);go();goc&&goc()};
  setTimeout(()=>{try{$('hs-ten').focus()}catch(e){}},50)}
 function ghiChu(t){const p=$('man').querySelector('p');p.textContent=p.textContent.replace(/ (Đang gửi|Đã gửi|Chưa gửi|Ba mẹ chụp).*$/,'')+' '+t}
 function gui(sao){
  if(!HS.ten)return;
  const CHUP='Ba mẹ chụp màn hình này gửi cô nhé.';
  const lop=lopLink()||(chuanLop(HS.lop)==='1.14'?'1.14':'');
  if(!lop){ghiChu(CHUP);return}
  ghiChu('Đang gửi kết quả cho cô...');
  let lan='?';try{if(typeof sai==='number')lan=sai}catch(e){}
  const d={lop,ten:HS.ten+' (lớp '+HS.lop+')',bai:TEN_BAI,dungLanDau:sao,soCau:3,chiTiet:'Sao: '+sao+'/3; số lần sai: '+lan+(window.DIEM?'; Điểm: '+window.DIEM:'')};
  fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)})
   .then(()=>ghiChu('Đã gửi kết quả cho cô.'),()=>ghiChu('Chưa gửi được. '+CHUP))}
 const mh=manHinh;
 manHinh=function(tieude,loi,nut,cb,saoSo){go();mh(tieude,loi,nut,cb,saoSo);if(saoSo)gui(saoSo)};
 window.__hsGui=gui;
 chen();
})();

</script>
</body>
</html>
