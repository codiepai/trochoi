<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vòng Quay Giáng Sinh - Trò chơi đầu giờ</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--u:min(1vh,1.6vw);--do:#d62828;--la:#1b7a3d;--vang:#ffd166;--font:"Baloo 2","Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:var(--font);font-weight:800;color:#fff;background:linear-gradient(#0f2a1c,#14532d 60%,#1b7a3d);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 14px 40px;gap:10px;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;font-weight:800;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:4px solid var(--vang);outline-offset:3px}
#tuyet{position:fixed;inset:0;pointer-events:none;z-index:1}
.bong{position:absolute;top:-10vh;color:#fff;animation:roi linear infinite;opacity:.85}
@keyframes roi{to{transform:translateY(115vh) translateX(var(--dx))}}
.wrap{position:relative;z-index:2;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:10px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{border:none;border-radius:30px;padding:6px 16px;background:#ffffffdd;color:#14532d;font-size:max(15px,calc(var(--u)*2.6))}
h1{font-size:max(28px,calc(var(--u)*6.4));text-align:center;line-height:1.05;color:var(--vang);text-shadow:0 4px 0 #8a1c1c}
.sub{font-size:max(16px,calc(var(--u)*3));text-align:center;color:#dcfce7;font-weight:700}
.hop{background:#fff;color:#12304a;border-radius:26px;padding:18px;width:100%;box-shadow:0 8px 0 #0006}
.hop label{display:block;font-size:max(16px,calc(var(--u)*3));margin-bottom:6px}
textarea{width:100%;min-height:30vh;border:4px solid #c9d6e6;border-radius:18px;padding:12px;font-family:inherit;font-weight:700;font-size:max(17px,calc(var(--u)*3.2));color:#12304a;resize:vertical;user-select:text;-webkit-user-select:text}
.dong{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:10px;font-size:max(15px,calc(var(--u)*2.8));font-weight:700}
.dong input[type=checkbox]{width:22px;height:22px;accent-color:var(--do)}
.lon{font-size:max(20px,calc(var(--u)*4.6));padding:.3em 1.2em;border:none;border-radius:22px;color:#fff;background:var(--do);box-shadow:0 7px 0 #8a1c1c}
.lon:active{transform:translateY(5px);box-shadow:0 2px 0 #8a1c1c}
.lon.xanh{background:var(--la);box-shadow:0 7px 0 #0d4a24}
.lon.phu{background:#fff;color:#14532d;box-shadow:0 7px 0 #9bb8d3}
.lon:disabled{opacity:.6}
.bao{color:#b3261e;font-size:max(15px,calc(var(--u)*2.8));min-height:1.3em;text-align:center}
#choi{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.con{font-size:max(16px,calc(var(--u)*3.2));background:#ffffff22;border-radius:30px;padding:4px 18px}
.bank{position:relative;width:min(88vw,60vh,640px);aspect-ratio:1}
#cv{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 0 #0006)}
.kim{position:absolute;top:-4%;left:50%;transform:translateX(-50%);font-size:max(40px,calc(var(--u)*8));z-index:3;filter:drop-shadow(0 4px 0 #0006);line-height:1}
.tam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:17%;aspect-ratio:1;border-radius:50%;border:none;background:radial-gradient(#ffe58a,#f0a800);color:#8a1c1c;font-size:max(14px,calc(var(--u)*3.4));box-shadow:0 5px 0 #0006,0 0 0 6px #fff;z-index:3;line-height:1.05}
.tam:active{transform:translate(-50%,-46%)}
.kq{background:linear-gradient(#fff,#fff4d6);color:#8a1c1c;border-radius:26px;padding:.1em .8em;text-align:center;box-shadow:0 8px 0 #0006,0 0 0 6px var(--vang);font-size:max(36px,calc(var(--u)*10));line-height:1.25;animation:hien .6s cubic-bezier(.3,1.6,.5,1);max-width:100%;overflow-wrap:anywhere}
@keyframes hien{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.da{width:100%;background:#0f2a1c99;border-radius:20px;padding:10px 14px}
.da h3{font-size:max(15px,calc(var(--u)*2.8));color:#dcfce7;margin-bottom:6px}
#ds{display:flex;flex-wrap:wrap;gap:6px}
#ds span{background:#fff;color:#8a1c1c;border-radius:14px;padding:.05em .6em;font-size:max(15px,calc(var(--u)*2.8))}
.bay2{position:fixed;pointer-events:none;z-index:60;animation:bayra 1.4s ease-out forwards;font-size:34px}
@keyframes bayra{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
#hetgio{position:fixed;inset:0;background:#0f2a1ccc;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#hetgio .hop{max-width:520px;text-align:center}
#hetgio h2{font-size:max(30px,calc(var(--u)*7));color:var(--do)}
#hetgio p{font-size:max(18px,calc(var(--u)*3.6));margin:.5em 0 .8em;font-weight:700}
.hang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="tuyet" aria-hidden="true"></div>
<div class="wrap">
 <div class="top"><button id="btnDS" hidden>✏️ Sửa danh sách</button><span></span><button id="btnAm">🔊 Đọc tên: Bật</button></div>
 <h1>🎡 Vòng Quay Giáng Sinh 🎄</h1>

 <div id="nhap" class="hop">
  <label for="dsText">Thầy cô dán danh sách học sinh vào đây (mỗi bạn một dòng, hoặc cách nhau bằng dấu phẩy):</label>
  <textarea id="dsText" placeholder="Nguyễn Minh An&#10;Trần Bảo Ngọc&#10;Lê Gia Huy&#10;..."></textarea>
  <div class="bao" id="bao"></div>
  <div class="dong">
   <label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" id="khongLap" checked> Không quay trúng lại bạn đã được gọi</label>
  </div>
  <div class="dong">
   <button class="lon phu" id="btnMau">Dùng danh sách mẫu</button>
   <button class="lon xanh" id="btnBD">🎄 Bắt đầu chơi</button>
  </div>
  <div class="sub" style="color:#4a6078;margin-top:8px;font-weight:600">Danh sách chỉ lưu trên máy này, không gửi đi đâu. Lần sau mở lại vẫn còn.</div>
 </div>

 <div id="choi" hidden>
  <div class="con" id="con"></div>
  <div class="bank"><div class="kim" aria-hidden="true">🔻</div><canvas id="cv"></canvas><button class="tam" id="quay" aria-label="Quay vòng quay">QUAY!</button></div>
  <div id="kq"></div>
  <div class="da"><h3>Các bạn đã được gọi:</h3><div id="ds"></div></div>
  <div class="dong"><button class="lon phu" id="btnLai">🔄 Gọi lại từ đầu</button></div>
 </div>
</div>

<div id="hetgio" hidden><div class="hop"><h2>🎄 Đã gọi hết cả lớp!</h2><p>Cả lớp đã được gọi tên rồi. Chúc các con một mùa Giáng sinh thật vui!</p><div class="hang"><button class="lon" id="btnTuDau">Gọi lại từ đầu</button><button class="lon phu" id="btnDong">Đóng</button></div></div></div>

<script>
const $=i=>document.getElementById(i);
const KHOA='noel-goi-ten-ds';
let tenList=[],conLai=[],daGoi=[],am=true,dangQuay=false,goc=0;
const MAUV=['#d62828','#fff4d6','#1b7a3d','#ffd166'],MCHU=['#fff','#8a1c1c','#fff','#8a1c1c'];

(function(){const t=$('tuyet');for(let i=0;i<36;i++){const s=document.createElement('span');s.className='bong';s.textContent=Math.random()<.5?'❄':'❅';s.style.left=Math.random()*100+'vw';s.style.fontSize=(10+Math.random()*22)+'px';s.style.animationDuration=(6+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*12)+'s';s.style.setProperty('--dx',(Math.random()*80-40)+'px');t.appendChild(s)}})();

let ac;function tick(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.start(t);o.stop(t+.1)}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tick(f),i*110))}

let giongVi=null;
function chonGiong(){giongVi=speechSynthesis.getVoices().find(x=>/^vi([-_]|$)/i.test(x.lang))||null}
if('speechSynthesis' in window){chonGiong();speechSynthesis.onvoiceschanged=chonGiong}
let amGG=null;
function noi(text){
  if(!am)return;
  try{if(amGG){amGG.pause();amGG=null}}catch(e){}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  /* co giong tieng Viet trong may thi dung, khong thi dung giong Google (can mang), khong bao gio doc bang giong Anh */
  if(giongVi&&'speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(text);u.lang=giongVi.lang;u.voice=giongVi;u.rate=.85;speechSynthesis.speak(u);return;
  }
  try{
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(text));
    amGG=a;const p=a.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
function phao(x,y,n){const E=['🎁','⭐','❄','🎄','🔔','✨'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='bay2';s.textContent=E[i%E.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*Math.PI*2,d=70+Math.random()*130;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}

function tachDS(txt){return txt.split(/[\n\r;,\t]+/).map(s=>s.replace(/^\s*\d+\s*[\.\)\-:]\s*/,'').replace(/\s+/g,' ').trim()).filter(Boolean)}
const MAU=['Nguyễn Minh An','Trần Bảo Ngọc','Lê Gia Huy','Phạm Khánh Linh','Hoàng Đức Anh','Võ Thanh Mai','Đặng Quốc Bảo','Bùi Ngọc Hân','Ngô Thảo Nguyên','Dương Tuấn Kiệt'];
function luu(){try{localStorage.setItem(KHOA,$('dsText').value)}catch(e){}}
function nap(){try{const s=localStorage.getItem(KHOA);if(s)$('dsText').value=s}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function danhSachQuay(){return $('khongLap').checked?conLai:tenList}

function ve(){
  const cv=$('cv'),d=window.devicePixelRatio||1,S=cv.clientWidth;
  if(cv.width!==S*d){cv.width=S*d;cv.height=S*d}
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,S,S);
  const L=danhSachQuay(),n=L.length,R=S/2-6;
  c.save();c.translate(S/2,S/2);
  c.beginPath();c.arc(0,0,R+5,0,7);c.fillStyle='#fff';c.fill();
  if(n===0){c.beginPath();c.arc(0,0,R,0,7);c.fillStyle='#d9dde3';c.fill();c.restore();return}
  const s=Math.PI*2/n;
  for(let i=0;i<n;i++){
    const a0=goc+i*s,a1=a0+s;
    c.beginPath();c.moveTo(0,0);c.arc(0,0,R,a0,a1);c.closePath();
    c.fillStyle=(n%4===1&&i===n-1)?MAUV[2]:MAUV[i%4];c.fill();
    c.strokeStyle='#ffffffaa';c.lineWidth=2;c.stroke();
  }
  const fs=Math.max(11,Math.min(S*.075,(R*.78)*s*1.1,S*.07));
  c.font='800 '+fs+'px Baloo 2,Segoe UI,Arial';c.textAlign='right';c.textBaseline='middle';
  for(let i=0;i<n;i++){
    c.save();c.rotate(goc+i*s+s/2);
    c.fillStyle=(n%4===1&&i===n-1)?MCHU[2]:MCHU[i%4];
    let t=L[i];const maxW=R*.66;
    while(t.length>3&&c.measureText(t).width>maxW)t=t.slice(0,-2);
    if(t!==L[i])t=t.trim()+'…';
    c.fillText(t,R-12,0);c.restore();
  }
  c.restore();
}

function veDS(){
  $('ds').innerHTML=daGoi.map(n=>'<span>'+esc(n)+'</span>').join('')||'<span style="background:none;color:#bbf7d0;font-weight:600">Chưa gọi bạn nào</span>';
  $('con').textContent=$('khongLap').checked?('Còn '+conLai.length+' / '+tenList.length+' bạn chưa được gọi'):('Lớp có '+tenList.length+' bạn');
  ve();
}
function batDau(){
  tenList=tachDS($('dsText').value);
  if(tenList.length<1){$('bao').textContent='Thầy cô dán ít nhất một tên học sinh nhé.';return}
  $('bao').textContent='';luu();conLai=tenList.slice();daGoi=[];$('kq').innerHTML='';
  $('nhap').hidden=true;$('choi').hidden=false;$('btnDS').hidden=false;goc=0;veDS();
}
function goiLai(){conLai=tenList.slice();daGoi=[];$('kq').innerHTML='';$('hetgio').hidden=true;veDS()}

function quay(){
  if(dangQuay)return;
  const L=danhSachQuay();
  if(L.length===0){$('hetgio').hidden=false;return}
  dangQuay=true;$('quay').disabled=true;$('kq').innerHTML='';
  const n=L.length,s=Math.PI*2/n;
  const dich=goc+Math.PI*2*(5+Math.floor(Math.random()*3))+Math.random()*Math.PI*2;
  const g0=goc,t0=performance.now(),T=4800;let lastIdx=-1;
  (function buoc(now){
    let p=Math.min(1,(now-t0)/T);const e=1-Math.pow(1-p,3);
    goc=g0+(dich-g0)*e;ve();
    const idx=Math.floor((((-Math.PI/2-goc)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/s);
    if(idx!==lastIdx){lastIdx=idx;tick(500+(idx%5)*40)}
    if(p<1){requestAnimationFrame(buoc);return}
    const ten=L[idx];
    fanfare();
    const k=document.createElement('div');k.className='kq';k.textContent=ten;$('kq').appendChild(k);
    const r=$('cv').getBoundingClientRect();phao(r.left+r.width/2,r.top+r.height/2,14);
    if($('khongLap').checked){const j=conLai.indexOf(ten);if(j>=0)conLai.splice(j,1)}
    daGoi.push(ten);noi(ten+' ơi!');
    dangQuay=false;$('quay').disabled=false;veDS();
  })(t0);
}

$('btnBD').onclick=batDau;
$('btnMau').onclick=()=>{$('dsText').value=MAU.join('\n')};
$('quay').onclick=quay;
$('btnLai').onclick=goiLai;$('btnTuDau').onclick=goiLai;
$('btnDong').onclick=()=>{$('hetgio').hidden=true};
$('khongLap').onchange=()=>{if(!$('choi').hidden)veDS()};
$('btnDS').onclick=()=>{$('choi').hidden=true;$('nhap').hidden=false;$('btnDS').hidden=true};
$('btnAm').onclick=()=>{am=!am;$('btnAm').textContent='🔊 Đọc tên: '+(am?'Bật':'Tắt');if(!am&&'speechSynthesis' in window)speechSynthesis.cancel()};
window.addEventListener('resize',()=>{if(!$('choi').hidden)ve()});
nap();
</script>
</body>
</html>
